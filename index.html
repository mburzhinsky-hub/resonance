<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />
  <title>RESONANCE</title>

  <meta name="theme-color" content="#06080e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RESONANCE" />
  <meta name="screen-orientation" content="portrait" />
  <meta name="orientation" content="portrait" />

  <style>
    :root{
      --bg-start:#05070d;
      --bg-mid:#0b121b;
      --bg-end:#010203;

      --panel-rgb:11,16,23;
      --panel-strong-rgb:16,24,36;
      --button-rgb:12,18,28;

      --accent-rgb:96,190,255;
      --accent-2-rgb:174,231,255;
      --accent-3-rgb:230,246,255;
      --shadow-rgb:96,190,255;

      --text-rgb:255,255,255;
      --safe-top:max(16px, env(safe-area-inset-top));
      --safe-bottom:max(18px, env(safe-area-inset-bottom));
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      user-select:none;
      -webkit-user-select:none;
    }

    html,
    body{
      width:100%;
      height:100%;
      margin:0;
    }

    html{
      background:#000;
      overscroll-behavior:none;
    }

    body{
      min-height:100vh;
      min-height:100dvh;
      overflow:hidden;
      color:rgb(var(--text-rgb));
      background:
        radial-gradient(circle at 50% -10%, rgba(255,255,255,.05), transparent 34%),
        linear-gradient(180deg, var(--bg-start), var(--bg-mid) 46%, var(--bg-end));
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Inter",
        "Helvetica Neue",
        Arial,
        sans-serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      text-rendering:optimizeLegibility;
      position:relative;
      touch-action:manipulation;
    }

    button{
      font:inherit;
      color:inherit;
    }

    #bgCanvas{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      z-index:0;
      pointer-events:none;
    }

    .background-vignette{
      position:fixed;
      inset:0;
      z-index:1;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 14%, rgba(255,255,255,.035), transparent 28%),
        linear-gradient(180deg, rgba(0,0,0,.06), rgba(0,0,0,.26) 46%, rgba(0,0,0,.42));
    }

    .app-shell{
      position:relative;
      z-index:2;
      width:100%;
      min-height:100vh;
      min-height:100dvh;
      display:flex;
      justify-content:center;
      align-items:stretch;
    }

    .device{
      position:relative;
      width:100%;
      max-width:430px;
      min-height:100vh;
      min-height:100dvh;
      padding:
        calc(var(--safe-top) + 6px)
        18px
        calc(var(--safe-bottom) + 16px);
      display:flex;
      justify-content:center;
      align-items:stretch;
    }

    .device::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      border-radius:32px;
      border:1px solid rgba(255,255,255,.03);
      background:
        linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0) 18%),
        linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.16));
      opacity:.9;
    }

    .app{
      position:relative;
      width:100%;
      display:flex;
      flex-direction:column;
      gap:18px;
      min-height:0;
      isolation:isolate;
    }

    .header{
      display:flex;
      flex-direction:column;
      gap:12px;
      flex:0 0 auto;
    }

    .brand-row{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:42px;
    }

    .brand{
      font-size:18px;
      font-weight:300;
      letter-spacing:.34em;
      color:rgba(255,255,255,.86);
      white-space:nowrap;
      transition:text-shadow .26s ease, opacity .26s ease;
    }

    .brand.is-playing{
      text-shadow:
        0 0 22px rgba(var(--accent-rgb), .12),
        0 0 44px rgba(var(--accent-rgb), .08);
    }

    .surface-panel{
      position:relative;
      background:
        linear-gradient(180deg, rgba(var(--panel-rgb), .64), rgba(var(--panel-rgb), .34));
      border:1px solid rgba(255,255,255,.07);
      box-shadow:
        0 16px 36px rgba(0,0,0,.26),
        inset 0 1px 0 rgba(255,255,255,.04);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }

    .theme-switcher{
      display:grid;
      grid-template-columns:repeat(4, minmax(0, 1fr));
      gap:8px;
      padding:8px;
      border-radius:22px;
    }

    .theme-btn{
      border:none;
      background:rgba(255,255,255,.02);
      border-radius:16px;
      min-height:48px;
      padding:0 8px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      cursor:pointer;
      color:rgba(255,255,255,.48);
      border:1px solid rgba(255,255,255,.04);
      transition:
        color .22s ease,
        background .22s ease,
        border-color .22s ease,
        box-shadow .22s ease,
        transform .16s ease;
      outline:none;
    }

    .theme-btn:active{
      transform:scale(.985);
    }

    .theme-btn.active{
      color:#fff;
      background:
        linear-gradient(180deg, rgba(var(--accent-rgb), .18), rgba(255,255,255,.03));
      border-color:rgba(var(--accent-3-rgb), .16);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.06),
        0 10px 24px rgba(var(--shadow-rgb), .14);
    }

    .theme-btn-label{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:13px;
      font-weight:600;
      letter-spacing:.01em;
    }

    .theme-dot{
      width:8px;
      height:8px;
      border-radius:50%;
      flex:0 0 8px;
      box-shadow:0 0 0 1px rgba(255,255,255,.10);
    }

    .theme-btn[data-theme="audi"] .theme-dot{
      background:linear-gradient(135deg, #46a6ff, #ebf7ff);
    }

    .theme-btn[data-theme="porsche"] .theme-dot{
      background:linear-gradient(135deg, #ff994b, #ffd1a0);
    }

    .theme-btn[data-theme="mercedes"] .theme-dot{
      background:linear-gradient(135deg, #aeb5bd, #ffffff);
    }

    .theme-btn[data-theme="bmw"] .theme-dot{
      background:linear-gradient(135deg, #3d95ff, #79e2ff);
    }

    .genre-switcher{
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:8px;
      padding:8px;
      border-radius:22px;
    }

    .genre-btn{
      border:none;
      min-height:50px;
      border-radius:16px;
      background:rgba(255,255,255,.02);
      color:rgba(255,255,255,.52);
      border:1px solid rgba(255,255,255,.05);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      font-size:15px;
      font-weight:600;
      letter-spacing:-.01em;
      transition:
        color .22s ease,
        background .22s ease,
        border-color .22s ease,
        box-shadow .22s ease,
        transform .16s ease;
      outline:none;
      position:relative;
      overflow:hidden;
    }

    .genre-btn:active{
      transform:scale(.985);
    }

    .genre-btn.active{
      color:#fff;
      background:
        linear-gradient(180deg, rgba(var(--accent-rgb), .16), rgba(255,255,255,.03));
      border-color:rgba(var(--accent-3-rgb), .16);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.06),
        0 12px 28px rgba(var(--shadow-rgb), .12);
    }

    .hero{
      position:relative;
      flex:1 1 auto;
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:0 6px;
    }

    .hero-orb{
      position:absolute;
      left:50%;
      top:50%;
      width:min(72vw, 320px);
      height:min(72vw, 320px);
      border-radius:50%;
      transform:translate(-50%, -50%) scale(1);
      background:
        radial-gradient(circle at 50% 42%, rgba(var(--accent-2-rgb), .18), rgba(var(--accent-rgb), .07) 46%, rgba(var(--accent-rgb), 0) 74%);
      filter:blur(22px);
      opacity:.9;
      pointer-events:none;
      transition:opacity .28s ease;
      will-change:transform, opacity;
    }

    .track-stack{
      position:relative;
      z-index:1;
      width:100%;
      max-width:340px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
    }

    .status-line{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
      min-height:22px;
      color:rgba(255,255,255,.38);
      font-size:13px;
      font-weight:600;
      letter-spacing:.06em;
      text-transform:uppercase;
    }

    .status-genre{
      color:rgba(var(--accent-3-rgb), .90);
    }

    .status-separator{
      width:4px;
      height:4px;
      border-radius:50%;
      background:rgba(255,255,255,.16);
      flex:0 0 4px;
    }

    .track-title{
      margin:0;
      width:100%;
      min-height:1.95em;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      font-size:clamp(40px, 11.2vw, 64px);
      line-height:.92;
      font-weight:650;
      letter-spacing:-.08em;
      color:#fff;
      text-wrap:balance;
      overflow-wrap:anywhere;
      text-shadow:0 0 24px rgba(var(--accent-rgb), .08);
      transition:opacity .2s ease, transform .2s ease;
    }

    .track-title.is-swapping{
      opacity:.72;
      transform:translateY(3px);
    }

    .level-meter{
      display:flex;
      align-items:flex-end;
      justify-content:center;
      gap:7px;
      min-height:18px;
      padding-top:2px;
      pointer-events:none;
    }

    .level-bar{
      width:4px;
      height:8px;
      border-radius:999px;
      background:rgba(255,255,255,.14);
      opacity:.46;
      transform-origin:50% 100%;
      transition:
        height .18s ease,
        opacity .18s ease,
        background .18s ease,
        box-shadow .18s ease;
    }

    .level-bar.live{
      background:rgba(var(--accent-3-rgb), .90);
      box-shadow:0 0 14px rgba(var(--accent-rgb), .24);
    }

    .control-panel{
      display:flex;
      flex-direction:column;
      gap:14px;
      flex:0 0 auto;
    }

    .transport{
      width:100%;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:12px;
    }

    .transport-btn{
      width:56px;
      height:56px;
      border:none;
      border-radius:50%;
      justify-self:center;
      display:grid;
      place-items:center;
      background:
        linear-gradient(180deg, rgba(var(--panel-rgb), .76), rgba(var(--panel-rgb), .46));
      border:1px solid rgba(255,255,255,.07);
      box-shadow:
        0 14px 26px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.04);
      color:rgba(255,255,255,.62);
      cursor:pointer;
      transition:
        color .22s ease,
        transform .16s ease,
        border-color .22s ease,
        box-shadow .22s ease,
        background .22s ease;
      outline:none;
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
    }

    .transport-btn:hover{
      color:#fff;
      border-color:rgba(var(--accent-3-rgb), .12);
      box-shadow:
        0 14px 28px rgba(0,0,0,.24),
        0 0 28px rgba(var(--shadow-rgb), .08),
        inset 0 1px 0 rgba(255,255,255,.04);
    }

    .transport-btn:active,
    .transport-btn.is-tapped{
      transform:scale(.96);
    }

    .play-btn{
      position:relative;
      width:108px;
      height:108px;
      border:none;
      border-radius:50%;
      display:grid;
      place-items:center;
      color:#fff;
      cursor:pointer;
      outline:none;
      background:
        radial-gradient(circle at 50% 28%, rgba(255,255,255,.14), rgba(255,255,255,.04) 42%, rgba(255,255,255,0) 70%),
        linear-gradient(180deg, rgba(var(--button-rgb), .94), rgba(var(--panel-strong-rgb), .72));
      border:1px solid rgba(var(--accent-3-rgb), .16);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 24px 48px rgba(0,0,0,.42),
        0 0 0 1px rgba(255,255,255,.02),
        0 0 36px rgba(var(--shadow-rgb), .10);
      transition:
        transform .18s ease,
        box-shadow .24s ease,
        border-color .24s ease,
        background .24s ease;
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }

    .play-btn::before{
      content:"";
      position:absolute;
      inset:-12px;
      border-radius:50%;
      border:1px solid rgba(var(--accent-rgb), .10);
      opacity:.9;
      transition:
        opacity .24s ease,
        transform .24s ease,
        box-shadow .24s ease,
        border-color .24s ease;
      pointer-events:none;
    }

    .play-btn:active{
      transform:scale(.97);
    }

    .play-btn.is-playing{
      border-color:rgba(var(--accent-3-rgb), .24);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.10),
        0 28px 56px rgba(0,0,0,.46),
        0 0 0 1px rgba(255,255,255,.02),
        0 0 48px rgba(var(--shadow-rgb), .18),
        0 0 84px rgba(var(--shadow-rgb), .08);
    }

    .play-btn.is-playing::before{
      border-color:rgba(var(--accent-rgb), .18);
      transform:scale(1.02);
      box-shadow:0 0 38px rgba(var(--shadow-rgb), .12);
    }

    .actions{
      width:100%;
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:10px;
    }

    .action-btn{
      min-height:50px;
      border:none;
      border-radius:18px;
      padding:0 16px;
      cursor:pointer;
      outline:none;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      background:
        linear-gradient(180deg, rgba(var(--panel-rgb), .74), rgba(var(--panel-rgb), .46));
      border:1px solid rgba(255,255,255,.07);
      color:rgba(255,255,255,.66);
      box-shadow:
        0 14px 28px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.04);
      transition:
        color .22s ease,
        background .22s ease,
        border-color .22s ease,
        box-shadow .22s ease,
        transform .16s ease;
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
    }

    .action-btn:hover{
      color:#fff;
      border-color:rgba(var(--accent-3-rgb), .12);
      box-shadow:
        0 14px 28px rgba(0,0,0,.24),
        0 0 28px rgba(var(--shadow-rgb), .08),
        inset 0 1px 0 rgba(255,255,255,.04);
    }

    .action-btn:active{
      transform:scale(.985);
    }

    .action-btn.ready{
      color:#fff;
      background:
        linear-gradient(180deg, rgba(var(--accent-rgb), .18), rgba(var(--panel-rgb), .54));
      border-color:rgba(var(--accent-3-rgb), .16);
      box-shadow:
        0 14px 28px rgba(0,0,0,.24),
        0 0 28px rgba(var(--shadow-rgb), .12),
        inset 0 1px 0 rgba(255,255,255,.06);
    }

    .action-btn:disabled{
      opacity:.58;
      cursor:default;
      transform:none;
      box-shadow:
        0 12px 22px rgba(0,0,0,.16),
        inset 0 1px 0 rgba(255,255,255,.03);
    }

    .sheet-backdrop{
      position:fixed;
      inset:0;
      z-index:20;
      background:rgba(0,0,0,.42);
      opacity:0;
      pointer-events:none;
      transition:opacity .26s ease;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }

    .sheet-backdrop.open{
      opacity:1;
      pointer-events:auto;
    }

    .queue-sheet{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:21;
      padding:0 10px calc(env(safe-area-inset-bottom) + 10px);
      transform:translateY(104%);
      transition:transform .32s cubic-bezier(.2,.8,.2,1);
      pointer-events:none;
    }

    .queue-sheet.open{
      transform:translateY(0);
      pointer-events:auto;
    }

    .queue-card{
      width:100%;
      max-width:430px;
      margin:0 auto;
      overflow:hidden;
      border-radius:28px 28px 22px 22px;
      background:
        linear-gradient(180deg, rgba(var(--panel-strong-rgb), .96), rgba(var(--panel-rgb), .98));
      border:1px solid rgba(255,255,255,.08);
      box-shadow:
        0 30px 80px rgba(0,0,0,.54),
        inset 0 1px 0 rgba(255,255,255,.04);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
    }

    .queue-head{
      padding:12px 18px 10px;
      border-bottom:1px solid rgba(255,255,255,.06);
    }

    .queue-handle{
      width:42px;
      height:5px;
      border-radius:999px;
      background:rgba(255,255,255,.14);
      margin:0 auto 12px;
    }

    .queue-summary{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      min-height:22px;
    }

    .queue-summary strong{
      font-size:15px;
      font-weight:700;
      color:#fff;
      letter-spacing:-.01em;
    }

    .queue-summary span{
      font-size:13px;
      color:rgba(255,255,255,.42);
    }

    .track-list{
      max-height:min(56vh, 460px);
      overflow:auto;
      padding:8px 10px 12px;
      scrollbar-width:none;
      -ms-overflow-style:none;
    }

    .track-list::-webkit-scrollbar{
      display:none;
    }

    .track-item{
      width:100%;
      border:none;
      border-radius:18px;
      padding:14px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      background:transparent;
      color:#fff;
      text-align:left;
      cursor:pointer;
      transition:background .18s ease, transform .16s ease, box-shadow .18s ease;
      outline:none;
    }

    .track-item:hover{
      background:rgba(255,255,255,.04);
    }

    .track-item:active{
      transform:scale(.995);
    }

    .track-item.active{
      background:rgba(var(--accent-rgb), .10);
      box-shadow:
        inset 0 0 0 1px rgba(var(--accent-3-rgb), .12),
        0 10px 22px rgba(var(--shadow-rgb), .10);
    }

    .track-main{
      min-width:0;
      flex:1;
      display:flex;
      align-items:center;
      gap:12px;
    }

    .track-index{
      width:28px;
      flex:0 0 28px;
      color:rgba(255,255,255,.28);
      font-size:12px;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .track-name{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:15px;
      font-weight:600;
      letter-spacing:-.01em;
    }

    .track-meta{
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:flex-end;
      min-width:18px;
    }

    .track-pill{
      width:8px;
      height:8px;
      border-radius:50%;
      background:rgba(var(--accent-3-rgb), .90);
      box-shadow:0 0 14px rgba(var(--accent-rgb), .24);
    }

    .queue-empty{
      padding:28px 14px 32px;
      text-align:center;
      color:rgba(255,255,255,.42);
      font-size:14px;
      line-height:1.5;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:calc(env(safe-area-inset-bottom) + 132px);
      transform:translateX(-50%) translateY(10px);
      z-index:40;
      max-width:calc(100vw - 48px);
      padding:11px 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.08);
      background:
        linear-gradient(180deg, rgba(var(--panel-strong-rgb), .92), rgba(var(--panel-rgb), .92));
      color:#fff;
      font-size:13px;
      font-weight:600;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      box-shadow:
        0 18px 38px rgba(0,0,0,.32),
        inset 0 1px 0 rgba(255,255,255,.05);
      opacity:0;
      pointer-events:none;
      transition:opacity .22s ease, transform .22s ease;
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    .orientation-lock{
      position:fixed;
      inset:0;
      z-index:60;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:rgba(0,0,0,.88);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      opacity:0;
      pointer-events:none;
      transition:opacity .22s ease;
    }

    .orientation-card{
      width:min(320px, 100%);
      padding:22px 20px;
      border-radius:24px;
      border:1px solid rgba(255,255,255,.08);
      background:
        linear-gradient(180deg, rgba(var(--panel-strong-rgb), .96), rgba(var(--panel-rgb), .94));
      text-align:center;
      box-shadow:
        0 22px 52px rgba(0,0,0,.4),
        inset 0 1px 0 rgba(255,255,255,.04);
    }

    .orientation-icon{
      width:54px;
      height:54px;
      margin:0 auto 14px;
      border-radius:18px;
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      color:rgba(var(--accent-3-rgb), .92);
      box-shadow:0 0 26px rgba(var(--shadow-rgb), .12);
    }

    .orientation-title{
      font-size:16px;
      font-weight:700;
      color:#fff;
      letter-spacing:-.01em;
      margin-bottom:6px;
    }

    .orientation-text{
      font-size:14px;
      line-height:1.5;
      color:rgba(255,255,255,.56);
    }

    @media (max-height: 760px){
      .device{
        padding:
          calc(var(--safe-top) + 4px)
          16px
          calc(var(--safe-bottom) + 14px);
      }

      .app{
        gap:16px;
      }

      .track-title{
        font-size:clamp(36px, 10.8vw, 54px);
      }

      .play-btn{
        width:98px;
        height:98px;
      }

      .transport-btn{
        width:52px;
        height:52px;
      }
    }

    @media (max-height: 660px){
      .header{
        gap:10px;
      }

      .theme-switcher,
      .genre-switcher{
        padding:7px;
        border-radius:20px;
      }

      .theme-btn{
        min-height:44px;
      }

      .genre-btn,
      .action-btn{
        min-height:46px;
      }

      .control-panel{
        gap:12px;
      }

      .track-stack{
        gap:12px;
      }

      .toast{
        bottom:calc(env(safe-area-inset-bottom) + 118px);
      }
    }

    @media (min-width: 431px){
      .device{
        box-shadow:
          0 0 0 1px rgba(255,255,255,.03),
          0 24px 80px rgba(0,0,0,.34);
      }
    }

    @media (orientation: landscape) and (max-width: 960px){
      .orientation-lock{
        opacity:1;
        pointer-events:auto;
      }
    }

    @media (prefers-reduced-motion: reduce){
      *,
      *::before,
      *::after{
        animation:none !important;
        transition:none !important;
        scroll-behavior:auto !important;
      }

      .hero-orb,
      .brand,
      .play-btn,
      .transport-btn,
      .action-btn{
        will-change:auto;
      }
    }
  </style>
</head>
<body>

  <div class="app-shell">

              <rect x="7" y="3" width="10" height="18" rx="2.5" stroke="currentColor" stroke-width="1.6"/>
              <path d="M4 9.5L2.5 11L4 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M20 14.5L21.5 13L20 11.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>

              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">

  <div class="sheet-backdrop" id="sheetBackdrop"></div>

  <div class="toast" id="toast" role="status" aria-live="polite">Готово</div>

  <audio id="audio" preload="metadata" playsinline webkit-playsinline></audio>

  <script>
    const APP_NAME = "RESONANCE";
    const TRACK_CACHE = "resonance-track-cache-v2";
    const MANIFEST_KEY = "resonance-local-manifest-v2";
    const THEME_KEY = "resonance-car-theme-v2";

    const GENRES = [
      { id: "lofi", name: "Lo-Fi", prefix: "lofi", maxFiles: 100 },
      { id: "rap", name: "Rap", prefix: "rap", maxFiles: 100 },
      { id: "jazz", name: "Jazz", prefix: "jazz", maxFiles: 100 }

    const THEMES = {

        metaColor: "#06080e",

          "--bg-start": "#05070d",

          "--bg-end": "#010203",

        },

          accent2: [174, 231, 255],
          accent3: [230, 246, 255]
        }
      },
      porsche: {
        label: "Porsche",
        metaColor: "#0d0704",
        css: {
          "--bg-start": "#0d0704",

          "--bg-end": "#050302",
          "--panel-rgb": "22,14,10",
          "--panel-strong-rgb": "36,22,16",
          "--button-rgb": "30,18,12",
          "--accent-rgb": "255,148,78",
          "--accent-2-rgb": "255,196,132",
          "--accent-3-rgb": "255,232,190",
          "--shadow-rgb": "255,148,78"
        },
        canvas: {
          mode: "porsche",
          bgTop: [13, 7, 4],
          bgMid: [26, 14, 9],
          bgBottom: [5, 3, 2],
          accent: [255, 148, 78],
          accent2: [255, 196, 132],
          accent3: [255, 232, 190]
        }
      },
      mercedes: {
        label: "Mercedes",
        metaColor: "#090a0c",
        css: {
          "--bg-start": "#090a0c",
          "--bg-mid": "#111419",
          "--bg-end": "#040506",
          "--panel-rgb": "15,18,23",
          "--panel-strong-rgb": "22,27,33",
          "--button-rgb": "18,22,28",
          "--accent-rgb": "190,198,208",
          "--accent-2-rgb": "229,235,241",
          "--accent-3-rgb": "255,255,255",
          "--shadow-rgb": "190,198,208"
        },
        canvas: {
          mode: "mercedes",
          bgTop: [9, 10, 12],
          bgMid: [16, 19, 24],
          bgBottom: [3, 4, 5],
          accent: [190, 198, 208],
          accent2: [229, 235, 241],
          accent3: [255, 255, 255]
        }
      },
      bmw: {
        label: "BMW",
        metaColor: "#05070c",
        css: {
          "--bg-start": "#05070c",
          "--bg-mid": "#09111d",
          "--bg-end": "#010204",
          "--panel-rgb": "9,15,25",
          "--panel-strong-rgb": "14,22,36",
          "--button-rgb": "10,18,30",
          "--accent-rgb": "68,158,255",
          "--accent-2-rgb": "96,224,255",
          "--accent-3-rgb": "219,246,255",
          "--shadow-rgb": "68,158,255"
        },
        canvas: {
          mode: "bmw",
          bgTop: [5, 7, 12],
          bgMid: [8, 15, 28],
          bgBottom: [1, 2, 4],
          accent: [68, 158, 255],
          accent2: [96, 224, 255],
          accent3: [219, 246, 255]
        }
      }
    };

    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const app = document.getElementById("app");
    const brand = document.getElementById("brand");
    const themeSwitcher = document.getElementById("themeSwitcher");
    const genreSwitcher = document.getElementById("genreSwitcher");
    const heroOrb = document.getElementById("heroOrb");

    const trackTitleEl = document.getElementById("trackTitle");
    const statusGenreEl = document.getElementById("statusGenre");
    const trackCounterEl = document.getElementById("trackCounter");
    const trackTimeEl = document.getElementById("trackTime");

    const bar1 = document.getElementById("bar1");
    const bar2 = document.getElementById("bar2");
    const bar3 = document.getElementById("bar3");

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const playBtn = document.getElementById("playBtn");
    const playIcon = document.getElementById("playIcon");

    const offlineBtn = document.getElementById("offlineBtn");
    const queueBtn = document.getElementById("queueBtn");
    const queueSheet = document.getElementById("queueSheet");
    const sheetBackdrop = document.getElementById("sheetBackdrop");
    const queueTitleEl = document.getElementById("queueTitle");
    const queueMetaEl = document.getElementById("queueMeta");
    const trackListEl = document.getElementById("trackList");
    const toastEl = document.getElementById("toast");

    const orientationLock = document.getElementById("orientationLock");
    const audio = document.getElementById("audio");

    const canvas = document.getElementById("bgCanvas");
    const ctx = canvas.getContext("2d", { alpha: true });

    const state = {
      themeKey: getStoredValue(THEME_KEY, "audi"),
      genre: GENRES[0],
      trackList: [],
      index: 0,
      trackTitle: "Lo-Fi 1",
      sheetOpen: false,
      toastTimer: null,
      lastTapAt: 0,
      currentObjectUrl: null,
      scanToken: 0,
      loadToken: 0,
      manifest: loadManifest(),
      localTrackCache: {},
      discoveryPromises: {},
      isCachingOffline: false,
      visualEnergy: 0.05,
      pulse: 0.12,
      titleTimer: null
    };

    const gesture = {
      active: false,
      ignore: false,
      startX: 0,
      startY: 0,
      startTime: 0
    };

    const particles = Array.from({ length: 22 }, () => ({
      x: Math.random(),
      y: Math.random(),
      radius: Math.random() * 1.8 + 0.5,
      alpha: Math.random() * 0.08 + 0.025,
      drift: Math.random() * 0.24 + 0.08
    }));

    function getStoredValue(key, fallback){
      try{
        const value = localStorage.getItem(key);
        return value ?? fallback;
      }catch(error){
        return fallback;
      }
    }

    function setStoredValue(key, value){
      try{
        localStorage.setItem(key, value);
      }catch(error){}
    }

    function loadManifest(){
      try{
        return JSON.parse(localStorage.getItem(MANIFEST_KEY) || "{}");
      }catch(error){
        return {};
      }
    }

    function saveManifest(){
      try{
        localStorage.setItem(MANIFEST_KEY, JSON.stringify(state.manifest));
      }catch(error){}
    }

    function createManifest(){
      const iconSvg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <rect width="512" height="512" rx="120" fill="#000000"/>
          <text
            x="256"
            y="282"
            text-anchor="middle"
            fill="white"
            font-family="Arial, Helvetica, sans-serif"
            font-size="56"
            letter-spacing="14"
          >
            R
          </text>
        </svg>
      `.trim();

      const iconUrl = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(iconSvg);
      const manifest = {
        name: APP_NAME,
        short_name: APP_NAME,
        start_url: "./",
        display: "standalone",
        orientation: "portrait",
        background_color: "#000000",
        theme_color: THEMES[state.themeKey]?.metaColor || "#06080e",
        icons: [
          { src: iconUrl, sizes: "192x192", type: "image/svg+xml", purpose: "any" },
          { src: iconUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any" }
        ]
      };

      const blob = new Blob([JSON.stringify(manifest)], {
        type: "application/manifest+json"
      });

      const manifestUrl = URL.createObjectURL(blob);
      const link = document.createElement("link");
      link.rel = "manifest";
      link.href = manifestUrl;
      document.head.appendChild(link);
    }

    async function registerServiceWorker(){
      if (!("serviceWorker" in navigator)) return;
      if (location.protocol === "file:") return;

      try{
        await navigator.serviceWorker.register("./sw.js");
      }catch(error){}
    }

    async function tryLockPortrait(){
      if (!screen.orientation || !screen.orientation.lock) return;

      try{
        await screen.orientation.lock("portrait");
      }catch(error){}
    }

    function applyTheme(themeKey){
      const theme = THEMES[themeKey] || THEMES.audi;
      state.themeKey = THEMES[themeKey] ? themeKey : "audi";
      setStoredValue(THEME_KEY, state.themeKey);

      Object.entries(theme.css).forEach(([property, value]) => {
        document.documentElement.style.setProperty(property, value);
      });

      const themeColorMeta = document.querySelector('meta[name="theme-color"]');
      if (themeColorMeta) themeColorMeta.setAttribute("content", theme.metaColor);

      themeSwitcher.querySelectorAll(".theme-btn").forEach((button) => {
        const isActive = button.dataset.theme === state.themeKey;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", isActive ? "true" : "false");
      });

      updateHeroOrb(0);
    }

    function initThemes(){
      themeSwitcher.querySelectorAll(".theme-btn").forEach((button) => {
        button.addEventListener("click", () => {
          applyTheme(button.dataset.theme);
        });
      });

      applyTheme(state.themeKey);
    }

    function renderGenres(){
      genreSwitcher.innerHTML = "";

      GENRES.forEach((genre) => {
        const button = document.createElement("button");
        const isActive = genre.id === state.genre.id;

        button.type = "button";
        button.className = "genre-btn" + (isActive ? " active" : "");
        button.textContent = genre.name;
        button.dataset.genreId = genre.id;
        button.setAttribute("aria-label", genre.name);
        button.setAttribute("aria-pressed", isActive ? "true" : "false");

        button.addEventListener("click", async () => {
          await selectGenre(genre, true);
        });

        genreSwitcher.appendChild(button);
      });
    }

    function updateGenreButtons(){
      genreSwitcher.querySelectorAll(".genre-btn").forEach((button) => {
        const isActive = button.dataset.genreId === state.genre.id;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", isActive ? "true" : "false");
      });
    }

    function setPlayIcon(paused){
      playIcon.innerHTML = paused
        ? '<path d="M9 6.7v10.6c0 .7.8 1.14 1.4.78l7.9-5.3a.93.93 0 0 0 0-1.56l-7.9-5.3A.93.93 0 0 0 9 6.7Z" fill="currentColor"/>'
        : '<path d="M8 6.5v11M16 6.5v11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';

      playBtn.classList.toggle("is-playing", !paused);
      brand.classList.toggle("is-playing", !paused);
      playBtn.setAttribute("aria-label", paused ? "Воспроизвести" : "Пауза");
    }

    function tapButton(button){
      button.classList.add("is-tapped");
      button.blur();
      window.setTimeout(() => button.classList.remove("is-tapped"), 140);
    }

    function showToast(text){
      window.clearTimeout(state.toastTimer);
      toastEl.textContent = text;
      toastEl.classList.add("show");

      state.toastTimer = window.setTimeout(() => {
        toastEl.classList.remove("show");
      }, 1600);
    }

    function openQueue(){
      state.sheetOpen = true;
      queueSheet.classList.add("open");
      sheetBackdrop.classList.add("open");
      queueSheet.setAttribute("aria-hidden", "false");
      queueBtn.setAttribute("aria-expanded", "true");
      renderTrackList();
    }

    function closeQueue(){
      state.sheetOpen = false;
      queueSheet.classList.remove("open");
      sheetBackdrop.classList.remove("open");
      queueSheet.setAttribute("aria-hidden", "true");
      queueBtn.setAttribute("aria-expanded", "false");
    }

    function stripExtension(fileName){
      return String(fileName).replace(/\.[^/.]+$/, "");
    }

    function humanizeName(fileName){
      return stripExtension(fileName)
        .replace(/[_-]+/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .replace(/\b\w/g, (char) => char.toUpperCase());
    }

    function buildTrackTitle(genre, index, url){
      try{
        const fileName = decodeURIComponent(url.split("/").pop() || "");
        const baseName = stripExtension(fileName).trim();
        const simplePattern = new RegExp(`^${genre.prefix}[\\s_-]?${index + 1}$`, "i");

        if (simplePattern.test(baseName)){
          return `${genre.name} ${index + 1}`;
        }

        const humanized = humanizeName(fileName);
        return humanized || `${genre.name} ${index + 1}`;
      }catch(error){
        return `${genre.name} ${index + 1}`;
      }
    }

    function escapeHtml(text){
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function isAudioLikeResponse(response){
      const contentType = String(response.headers.get("content-type") || "").toLowerCase();
      if (!contentType) return response.ok || response.status === 206;
      return !contentType.includes("text/html");
    }

    function formatTrackCounter(current, total){
      if (!total) return "—";
      return `${String(current).padStart(2, "0")} / ${String(total).padStart(2, "0")}`;
    }

    function formatTrackCount(count){
      const mod10 = count % 10;
      const mod100 = count % 100;

      if (mod10 === 1 && mod100 !== 11) return `${count} трек`;
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return `${count} трека`;
      return `${count} треков`;
    }

    function formatTime(seconds){
      if (!Number.isFinite(seconds) || seconds < 0) return "00:00";
      const minutes = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function updateNowPlayingUI(options = {}){
      const { animateTitle = true } = options;

      window.clearTimeout(state.titleTimer);

      if (animateTitle){
        trackTitleEl.classList.add("is-swapping");
        state.titleTimer = window.setTimeout(() => {
          trackTitleEl.textContent = state.trackTitle;
          trackTitleEl.classList.remove("is-swapping");
          state.titleTimer = null;
        }, 70);
      }else{
        trackTitleEl.textContent = state.trackTitle;
        trackTitleEl.classList.remove("is-swapping");
      }

      statusGenreEl.textContent = state.genre.name;
      trackCounterEl.textContent = formatTrackCounter(state.index + 1, state.trackList.length);
      queueTitleEl.textContent = state.genre.name;
      queueMetaEl.textContent = formatTrackCount(state.trackList.length);
    }

    function renderTrackList(){
      if (!state.trackList.length){
        trackListEl.innerHTML = '<div class="queue-empty">Треки для этого жанра не найдены.</div>';
        queueTitleEl.textContent = state.genre.name;
        queueMetaEl.textContent = formatTrackCount(0);
        return;
      }

      const fragment = document.createDocumentFragment();

      state.trackList.forEach((url, index) => {
        const button = document.createElement("button");
        const active = index === state.index;
        const title = buildTrackTitle(state.genre, index, url);

        button.type = "button";
        button.className = "track-item" + (active ? " active" : "");
        button.setAttribute("aria-label", title);

        button.innerHTML = `
          <span class="track-main">
            <span class="track-index">${String(index + 1).padStart(2, "0")}</span>
            <span class="track-name">${escapeHtml(title)}</span>
          </span>
          <span class="track-meta">
            ${active ? '<span class="track-pill" aria-hidden="true"></span>' : ""}
          </span>
        `;

        button.addEventListener("click", async () => {
          state.index = index;
          await loadTrackAt(index, true);
          closeQueue();
        });

        fragment.appendChild(button);
      });

      trackListEl.innerHTML = "";
      trackListEl.appendChild(fragment);
    }

    async function fileExists(url){
      if (navigator.onLine === false) return false;

      try{
        const headResponse = await fetch(url, {
          method: "HEAD",
          cache: "no-store"
        });

        if (headResponse.ok && isAudioLikeResponse(headResponse)) return true;
      }catch(error){}

      try{
        const rangeResponse = await fetch(url, {
          method: "GET",
          headers: { Range: "bytes=0-0" },
          cache: "no-store"
        });

        return (rangeResponse.ok || rangeResponse.status === 206) && isAudioLikeResponse(rangeResponse);
      }catch(error){
        return false;
      }
    }

    async function getLocalTracksForGenre(genre){
      if (state.discoveryPromises[genre.id]) {
        return state.discoveryPromises[genre.id];
      }

      state.discoveryPromises[genre.id] = (async () => {
        if (state.manifest[genre.id]?.length) {
          state.localTrackCache[genre.id] = state.manifest[genre.id];
        }

        if (navigator.onLine === false && state.localTrackCache[genre.id]?.length) {
          return state.localTrackCache[genre.id];
        }

        const discovered = [];

        for (let i = 1; i <= genre.maxFiles; i += 1){
          const url = `./${genre.prefix}-${i}.mp3`;
          const exists = await fileExists(url);

          if (exists){
            discovered.push(url);
          }else{
            break;
          }
        }

        if (discovered.length){
          state.localTrackCache[genre.id] = discovered;
          state.manifest[genre.id] = discovered;
          saveManifest();
          return discovered;
        }

        return state.localTrackCache[genre.id] || [];
      })();

      try{
        return await state.discoveryPromises[genre.id];
      }finally{
        delete state.discoveryPromises[genre.id];
      }
    }

    async function getCacheStore(){
      if (!("caches" in window)) return null;

      try{
        return await caches.open(TRACK_CACHE);
      }catch(error){
        return null;
      }
    }

    async function isGenreCachedOffline(genre){
      const urls = state.manifest[genre.id] || state.localTrackCache[genre.id] || [];
      if (!urls.length) return false;

      const cache = await getCacheStore();
      if (!cache) return false;

      for (const url of urls){
        const match = await cache.match(url);
        if (!match) return false;
      }

      return true;
    }

    async function updateOfflineButton(){
      if (!("caches" in window)){
        offlineBtn.disabled = true;
        offlineBtn.classList.remove("ready");
        offlineBtn.textContent = "Офлайн недоступен";
        return;
      }

      if (state.isCachingOffline){
        offlineBtn.disabled = true;
        return;
      }

      offlineBtn.disabled = false;
      const ready = await isGenreCachedOffline(state.genre);
      offlineBtn.classList.toggle("ready", ready);
      offlineBtn.textContent = ready ? "Офлайн готов" : "Скачать офлайн";
    }

    async function cacheGenreOffline(genre){
      if (state.isCachingOffline) return;

      const alreadyReady = await isGenreCachedOffline(genre);
      if (alreadyReady){
        await updateOfflineButton();
        showToast("Жанр уже доступен офлайн");
        return;
      }

      const urls = await getLocalTracksForGenre(genre);
      if (!urls.length){
        showToast(navigator.onLine === false ? "Сначала открой жанр онлайн" : "Файлы не найдены");
        await updateOfflineButton();
        return;
      }

      const cache = await getCacheStore();
      if (!cache){
        showToast("Офлайн недоступен");
        await updateOfflineButton();
        return;
      }

      state.isCachingOffline = true;
      offlineBtn.disabled = true;

      try{
        for (let i = 0; i < urls.length; i += 1){
          const url = urls[i];
          offlineBtn.textContent = `Скачивание ${i + 1}/${urls.length}`;

          const existing = await cache.match(url);
          if (existing) continue;

          const response = await fetch(url, { cache: "no-store" });
          if (!response.ok || !isAudioLikeResponse(response)) throw new Error("download_failed");
          await cache.put(url, response.clone());
        }

        showToast("Жанр сохранён офлайн");
      }catch(error){
        showToast("Не удалось скачать");
      }finally{
        state.isCachingOffline = false;
        await updateOfflineButton();
      }
    }

    async function revokeCurrentObjectUrl(){
      if (!state.currentObjectUrl) return;

      try{
        URL.revokeObjectURL(state.currentObjectUrl);
      }catch(error){}

      state.currentObjectUrl = null;
    }

    async function resolvePlayableSource(url){
      await revokeCurrentObjectUrl();

      const cache = await getCacheStore();
      if (cache){
        const cachedResponse = await cache.match(url);
        if (cachedResponse){
          const blob = await cachedResponse.blob();
          state.currentObjectUrl = URL.createObjectURL(blob);
          return state.currentObjectUrl;
        }
      }

      return url;
    }

    async function selectGenre(genre, autoplay = true){
      state.scanToken += 1;
      const token = state.scanToken;

      state.genre = genre;
      state.index = 0;
      updateGenreButtons();
      closeQueue();

      const tracks = await getLocalTracksForGenre(genre);
      if (token !== state.scanToken) return;

      state.trackList = tracks;

      if (!tracks.length){
        state.trackTitle = genre.name;
        updateNowPlayingUI();
        trackTimeEl.textContent = navigator.onLine === false ? "Нет офлайна" : "Нет файлов";
        audio.pause();
        audio.removeAttribute("src");
        audio.load();
        setPlayIcon(true);
        renderTrackList();
        await updateOfflineButton();
        showToast(navigator.onLine === false ? "Сначала скачай жанр" : "Файлы не найдены");
        return;
      }

      await loadTrackAt(0, autoplay);
      await updateOfflineButton();
    }

    async function loadTrackAt(index, autoplay = true){
      if (!state.trackList.length) return;

      state.loadToken += 1;
      const token = state.loadToken;

      state.index = ((index % state.trackList.length) + state.trackList.length) % state.trackList.length;

      const url = state.trackList[state.index];
      state.trackTitle = buildTrackTitle(state.genre, state.index, url);
      trackTimeEl.textContent = "00:00";
      updateNowPlayingUI();
      renderTrackList();
      updateMediaSession();

      const source = await resolvePlayableSource(url);
      if (token !== state.loadToken) return;

      audio.src = source;
      audio.load();

      if (autoplay){
        await safePlay();
      }
    }

    async function nextTrack(){
      if (!state.trackList.length) return;
      const nextIndex = (state.index + 1) % state.trackList.length;
      await loadTrackAt(nextIndex, true);
    }

    async function prevTrack(){
      if (!state.trackList.length) return;
      const prevIndex = (state.index - 1 + state.trackList.length) % state.trackList.length;
      await loadTrackAt(prevIndex, true);
    }

    async function ensurePlaybackHints(){
      try{
        if ("audioSession" in navigator && navigator.audioSession){
          navigator.audioSession.type = "playback";
        }
      }catch(error){}
    }

    async function safePlay(){
      try{
        await ensurePlaybackHints();
        await audio.play();
      }catch(error){
        if (navigator.onLine === false || state.currentObjectUrl){
          showToast("Трек недоступен офлайн");
        }else{
          showToast("Не удалось воспроизвести");
        }
      }
    }

    async function togglePlayback(){
      if (!audio.src){
        await selectGenre(state.genre || GENRES[0], true);
        return;
      }

      if (audio.paused){
        await safePlay();
      }else{
        audio.pause();
      }
    }

    function updateTimeUI(){
      trackTimeEl.textContent = formatTime(audio.currentTime || 0);

      if ("mediaSession" in navigator && navigator.mediaSession && "setPositionState" in navigator.mediaSession){
        try{
          if (Number.isFinite(audio.duration) && audio.duration > 0){
            navigator.mediaSession.setPositionState({
              duration: audio.duration,
              playbackRate: audio.playbackRate || 1,
              position: Math.min(audio.currentTime, audio.duration)
            });
          }
        }catch(error){}
      }
    }

    function createArtworkDataUrl(text){
      const safeText = String(text || APP_NAME).slice(0, 28);
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <defs>
            <radialGradient id="g" cx="50%" cy="35%" r="65%">
              <stop offset="0%" stop-color="rgb(${THEMES[state.themeKey].canvas.accent2.join(",")})" stop-opacity=".24"/>
              <stop offset="55%" stop-color="rgb(${THEMES[state.themeKey].canvas.accent.join(",")})" stop-opacity=".12"/>
              <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
            </radialGradient>
          </defs>
          <rect width="512" height="512" rx="112" fill="#000000"/>
          <rect width="512" height="512" rx="112" fill="url(#g)"/>
          <text
            x="256"
            y="276"
            text-anchor="middle"
            fill="white"
            font-family="Arial, Helvetica, sans-serif"
            font-size="42"
            letter-spacing="8"
          >
            ${safeText}
          </text>
        </svg>
      `);
    }

    function bindMediaSessionHandlers(){
      if (!("mediaSession" in navigator)) return;

      try{
        navigator.mediaSession.setActionHandler("play", async () => { await safePlay(); });
      }catch(error){}

      try{
        navigator.mediaSession.setActionHandler("pause", () => { audio.pause(); });
      }catch(error){}

      try{
        navigator.mediaSession.setActionHandler("nexttrack", async () => { await nextTrack(); });
      }catch(error){}

      try{
        navigator.mediaSession.setActionHandler("previoustrack", async () => { await prevTrack(); });
      }catch(error){}
    }

    function updateMediaSession(){
      if (!("mediaSession" in navigator)) return;

      navigator.mediaSession.metadata = new MediaMetadata({
        title: state.trackTitle || state.genre.name,
        artist: state.genre.name,
        album: APP_NAME,
        artwork: [{
          src: createArtworkDataUrl(state.genre.name),
          sizes: "512x512",
          type: "image/svg+xml"
        }]
      });

      updateMediaSessionPlayback();
    }

    function updateMediaSessionPlayback(){
      if (!("mediaSession" in navigator)) return;
      navigator.mediaSession.playbackState = audio.paused ? "paused" : "playing";
    }

    function getInteractiveGestureTarget(target){
      return Boolean(
        target.closest(
          "button, .theme-switcher, .genre-switcher, .queue-sheet, .queue-card, .track-list"
        )
      );
    }

    function handleGestureStart(event){
      if (event.touches.length !== 1) return;

      const touch = event.touches[0];
      gesture.active = true;
      gesture.ignore = getInteractiveGestureTarget(event.target) || state.sheetOpen;
      gesture.startX = touch.clientX;
      gesture.startY = touch.clientY;
      gesture.startTime = Date.now();
    }

    async function handleGestureEnd(event){
      if (!gesture.active) return;
      gesture.active = false;

      if (gesture.ignore) return;

      const touch = event.changedTouches[0];
      const dx = touch.clientX - gesture.startX;
      const dy = touch.clientY - gesture.startY;
      const dt = Date.now() - gesture.startTime;
      const absX = Math.abs(dx);
      const absY = Math.abs(dy);
      const now = Date.now();

      const isTap = dt < 240 && absX < 12 && absY < 12;
      if (isTap){
        if (now - state.lastTapAt < 280){
          state.lastTapAt = 0;
          await togglePlayback();
        }else{
          state.lastTapAt = now;
        }
        return;
      }

      state.lastTapAt = 0;

      if (dt < 700 && absX > absY && absX > 48){
        if (dx < 0){
          await nextTrack();
        }else{
          await prevTrack();
        }
      }
    }

    function setupGestures(){
      app.addEventListener("touchstart", handleGestureStart, { passive: true });
      app.addEventListener("touchend", handleGestureEnd, { passive: true });

      app.addEventListener("dblclick", async (event) => {
        if (getInteractiveGestureTarget(event.target) || state.sheetOpen) return;
        await togglePlayback();
      });

      window.addEventListener("keydown", async (event) => {
        if (event.key === "ArrowRight") await nextTrack();
        if (event.key === "ArrowLeft") await prevTrack();
        if (event.key === " "){
          event.preventDefault();
          await togglePlayback();
        }
        if (event.key === "Escape") closeQueue();
      });
    }

    function initWarmup(){
      const warmup = async () => {
        await ensurePlaybackHints();
      };

      ["touchstart", "click"].forEach((eventName) => {
        window.addEventListener(eventName, warmup, {
          passive: true,
          once: true
        });
      });
    }

    function resizeCanvas(){
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const width = window.innerWidth;
      const height = window.innerHeight;

      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const landscapeBlocked = window.matchMedia("(orientation: landscape) and (max-width: 960px)").matches;
      orientationLock.setAttribute("aria-hidden", landscapeBlocked ? "false" : "true");
    }

    function rgb(color, alpha){
      return `rgba(${color.join(",")},${alpha})`;
    }

    function drawGlow(x, y, radius, color, innerAlpha, outerAlpha = 0){
      const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
      gradient.addColorStop(0, rgb(color, innerAlpha));
      gradient.addColorStop(.45, rgb(color, Math.max(innerAlpha * .34, outerAlpha)));
      gradient.addColorStop(1, rgb(color, outerAlpha));

      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawRibbon(points, lineWidth, colorA, colorB, alpha){
      const gradient = ctx.createLinearGradient(points[0], points[1], points[6], points[7]);
      gradient.addColorStop(0, rgb(colorA, 0));
      gradient.addColorStop(.35, rgb(colorA, alpha));
      gradient.addColorStop(.65, rgb(colorB, alpha * 1.1));
      gradient.addColorStop(1, rgb(colorB, 0));

      ctx.strokeStyle = gradient;
      ctx.lineWidth = lineWidth;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(points[0], points[1]);
      ctx.bezierCurveTo(points[2], points[3], points[4], points[5], points[6], points[7]);
      ctx.stroke();
    }

    function drawHorizontalLine(y, width, color, alpha){
      const startX = window.innerWidth * 0.18;
      const endX = window.innerWidth * 0.82;
      const gradient = ctx.createLinearGradient(startX, y, endX, y);
      gradient.addColorStop(0, rgb(color, 0));
      gradient.addColorStop(.5, rgb(color, alpha));
      gradient.addColorStop(1, rgb(color, 0));

      ctx.fillStyle = gradient;
      ctx.fillRect(startX, y, endX - startX, width);
    }

    function drawAudiBackground(theme, time, energy){
      const w = window.innerWidth;
      const h = window.innerHeight;
      const sway = Math.sin(time * .38) * h * .012;

      drawGlow(w * .22, h * .24, Math.min(w, h) * .40, theme.accent, .22 + energy * .22);
      drawGlow(w * .78, h * .68, Math.min(w, h) * .46, theme.accent2, .14 + energy * .16);
      drawGlow(w * .56, h * .46, Math.min(w, h) * .22, theme.accent3, .10 + energy * .10);

      drawHorizontalLine(h * .52 + sway * .25, 1, theme.accent3, .08 + energy * .10);

      drawRibbon(
        [w * .06, h * .75, w * .22, h * .77 - sway, w * .56, h * .48 + sway, w * .90, h * .28],
        2.2,
        theme.accent,
        theme.accent3,
        .12 + energy * .10
      );

      drawRibbon(
        [w * .14, h * .84, w * .30, h * .82 - sway * .7, w * .68, h * .58 + sway * .7, w * .94, h * .36],
        1.3,
        theme.accent2,
        theme.accent,
        .10 + energy * .08
      );
    }

    function drawPorscheBackground(theme, time, energy){
      const w = window.innerWidth;
      const h = window.innerHeight;
      const sway = Math.sin(time * .34) * h * .018;

      drawGlow(w * .72, h * .28, Math.min(w, h) * .38, theme.accent, .20 + energy * .20);
      drawGlow(w * .28, h * .72, Math.min(w, h) * .42, theme.accent2, .14 + energy * .15);
      drawGlow(w * .50, h * .48, Math.min(w, h) * .28, theme.accent3, .09 + energy * .09);

      ctx.save();
      ctx.translate(w * .50, h * .48);
      ctx.rotate(-0.12 + Math.sin(time * .16) * .02);

      const ellipse = ctx.createRadialGradient(0, 0, 0, 0, 0, Math.min(w, h) * .28);
      ellipse.addColorStop(0, rgb(theme.accent2, .10 + energy * .08));
      ellipse.addColorStop(.55, rgb(theme.accent, .05 + energy * .05));
      ellipse.addColorStop(1, rgb(theme.accent, 0));

      ctx.fillStyle = ellipse;
      ctx.beginPath();
      ctx.ellipse(0, 0, w * .26, h * .09, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      drawRibbon(
        [w * .04, h * .68, w * .22, h * .70 + sway, w * .54, h * .40 - sway, w * .88, h * .34],

        theme.accent3,

      );

      drawRibbon(
        [w * .18, h * .82, w * .32, h * .76 + sway * .8, w * .66, h * .58 - sway * .6, w * .94, h * .44],

      drawHorizontalLine(h * .54 + sway, 1, theme.accent3, .07 + energy * .07);

    function drawBmwBackground(theme, time, energy){
      const w = window.innerWidth;
      const h = window.innerHeight;
      const sway = Math.sin(time * .52) * h * .016;

      drawGlow(w * .18, h * .30, Math.min(w, h) * .36, theme.accent, .18 + energy * .18);
      drawGlow(w * .78, h * .60, Math.min(w, h) * .42, theme.accent2, .14 + energy * .16);

      );

      );

      ctx.save();

      const beam = ctx.createLinearGradient(-w * .16, 0, w * .16, 0);
      beam.addColorStop(0, rgb(theme.accent3, 0));
      beam.addColorStop(.5, rgb(theme.accent3, .07 + energy * .07));
      beam.addColorStop(1, rgb(theme.accent3, 0));

    function drawParticles(theme, time, energy){
      const w = window.innerWidth;
      const h = window.innerHeight;

      particles.forEach((particle, index) => {
        const x = particle.x * w + Math.sin(time * particle.drift + particle.y * 10) * 8;
        const y = particle.y * h + Math.cos(time * particle.drift + particle.x * 9) * 8;
        const color = index % 3 === 0 ? theme.accent3 : index % 2 === 0 ? theme.accent2 : theme.accent;

        ctx.beginPath();
        ctx.arc(x, y, particle.radius, 0, Math.PI * 2);
        ctx.fillStyle = rgb(color, particle.alpha * (.9 + energy * 1.1));
        ctx.fill();
      });
    }

    function getTargetEnergy(time){
      if (prefersReducedMotion) return audio.paused || !audio.src ? 0.05 : 0.12;
      const beat = Math.sin(time * 1.9) * 0.012 + Math.sin(time * 0.7 + .8) * 0.01;
      const activeBoost = audio.paused || !audio.src ? 0 : 0.12;
      return Math.max(0.04, 0.05 + beat + activeBoost);
    }

    function updateLevelMeter(time, energy){
      const bars = [bar1, bar2, bar3];

      if (audio.paused || !audio.src){
        bars.forEach((bar) => {
          bar.classList.remove("live");
          bar.style.height = "8px";
          bar.style.opacity = ".46";
        });
        return;
      }

      const t = time * 2.6;
      const values = [
        8 + Math.max(0, (Math.sin(t) * .5 + .5) * 12 + energy * 30),
        8 + Math.max(0, (Math.sin(t + .7) * .5 + .5) * 14 + energy * 34),
        8 + Math.max(0, (Math.sin(t + 1.4) * .5 + .5) * 12 + energy * 30)
      ];

      bars.forEach((bar, index) => {
        bar.classList.add("live");
        bar.style.height = `${Math.round(values[index])}px`;
        bar.style.opacity = String(0.66 + energy * 1.4);
      });
    }

    function updateHeroOrb(energy){
      const idle = audio.paused || !audio.src ? .82 : .96;
      const scale = idle + energy * 1.05;
      const opacity = audio.paused || !audio.src ? 0.72 : 0.88 + energy * 0.14;
      heroOrb.style.transform = `translate(-50%, -50%) scale(${scale})`;
      heroOrb.style.opacity = String(Math.min(opacity, 1));
    }

    function drawBackground(frameTime){
      const time = frameTime * 0.001;
      const width = window.innerWidth;
      const height = window.innerHeight;
      const theme = THEMES[state.themeKey]?.canvas || THEMES.audi.canvas;

      const energyTarget = getTargetEnergy(time);
      state.visualEnergy += (energyTarget - state.visualEnergy) * (prefersReducedMotion ? 0.06 : 0.045);
      state.pulse += ((0.14 + state.visualEnergy * 0.65) - state.pulse) * 0.05;

      const background = ctx.createLinearGradient(0, 0, 0, height);
      background.addColorStop(0, rgb(theme.bgTop, 1));
      background.addColorStop(.48, rgb(theme.bgMid, 1));
      background.addColorStop(1, rgb(theme.bgBottom, 1));

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = background;
      ctx.fillRect(0, 0, width, height);

      switch (theme.mode){
        case "porsche":
          drawPorscheBackground(theme, time, state.visualEnergy);
          break;
        case "mercedes":
          drawMercedesBackground(theme, time, state.visualEnergy);
          break;
        case "bmw":
          drawBmwBackground(theme, time, state.visualEnergy);
          break;
        case "audi":
        default:
          drawAudiBackground(theme, time, state.visualEnergy);
          break;
      }

      drawParticles(theme, time, state.visualEnergy);
      updateLevelMeter(time, state.visualEnergy);
      updateHeroOrb(state.visualEnergy);

      window.requestAnimationFrame(drawBackground);
    }

    function setupEvents(){
      playBtn.addEventListener("click", togglePlayback);

      prevBtn.addEventListener("click", async () => {
        tapButton(prevBtn);
        await prevTrack();
      });

      nextBtn.addEventListener("click", async () => {
        tapButton(nextBtn);
        await nextTrack();
      });

      offlineBtn.addEventListener("click", async () => {
        await cacheGenreOffline(state.genre);
      });

      queueBtn.addEventListener("click", () => {
        if (state.sheetOpen) closeQueue();
        else openQueue();
      });

      sheetBackdrop.addEventListener("click", closeQueue);

      audio.addEventListener("play", () => {
        setPlayIcon(false);
        updateMediaSessionPlayback();
      });

      audio.addEventListener("pause", () => {
        setPlayIcon(true);
        updateMediaSessionPlayback();
      });

      audio.addEventListener("ended", async () => {
        await nextTrack();
      });

      audio.addEventListener("loadedmetadata", updateTimeUI);
      audio.addEventListener("timeupdate", updateTimeUI);

      audio.addEventListener("error", async () => {
        if (navigator.onLine === false || state.currentObjectUrl){
          showToast("Трек недоступен офлайн");
          return;
        }

        if (state.trackList.length <= 1){
          showToast("Не удалось загрузить трек");
          audio.pause();
          return;
        }

        await nextTrack();
      });

      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("orientationchange", resizeCanvas);
      window.addEventListener("online", () => { void updateOfflineButton(); });
      window.addEventListener("offline", () => { void updateOfflineButton(); });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) updateMediaSessionPlayback();
      });
    }

    async function init(){
      createManifest();
      bindMediaSessionHandlers();
      initThemes();
      renderGenres();
      setPlayIcon(true);
      updateNowPlayingUI({ animateTitle: false });
      trackTimeEl.textContent = "00:00";
      resizeCanvas();
      setupEvents();
      setupGestures();
      initWarmup();
      void registerServiceWorker();
      void tryLockPortrait();
      window.requestAnimationFrame(drawBackground);
      await selectGenre(state.genre, false);
      await updateOfflineButton();

    }

    init();
  </script>
</body>
</html>
