<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>RESONANCE</title>

  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RESONANCE" />

  <style>
    :root{
      --bg:#000;
      --text:#fff;
      --muted:rgba(255,255,255,.34);
      --muted-2:rgba(255,255,255,.18);
      --line:rgba(255,255,255,.08);
      --panel:rgba(255,255,255,.04);
      --panel-2:rgba(255,255,255,.06);
      --safe-top:max(14px, env(safe-area-inset-top));
      --safe-bottom:max(18px, env(safe-area-inset-bottom));

      --theme-a:110,200,255;
      --theme-b:255,150,120;
      --theme-c:185,232,255;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      user-select:none;
      -webkit-user-select:none;
    }

    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:#000;
      color:var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Inter",
        "Helvetica Neue",
        Arial,
        sans-serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      text-rendering:optimizeLegibility;
    }

    body{
      position:relative;
      background:#000;
    }

    #bgCanvas{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      z-index:0;
      pointer-events:none;
    }

    .app{
      position:relative;
      z-index:2;
      width:100%;
      height:100%;
      display:flex;
      justify-content:center;
      align-items:stretch;
    }

    .phone{
      position:relative;
      width:100%;
      max-width:430px;
      height:100%;
      padding:
        calc(var(--safe-top) + 6px)
        22px
        calc(var(--safe-bottom) + 16px);
      display:flex;
      flex-direction:column;
      overflow:hidden;
      background:transparent;
      transition:max-width .25s ease, padding .25s ease;
    }

    .gesture-layer{
      position:absolute;
      inset:0;
      z-index:3;
      background:transparent;
    }

    .top{
      position:relative;
      z-index:4;
      min-height:72px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
    }

    .logo{
      font-size:20px;
      font-weight:300;
      letter-spacing:.34em;
      color:rgba(255,255,255,.84);
      transition:opacity .24s ease, text-shadow .24s ease;
      white-space:nowrap;
    }

    .logo.playing{
      text-shadow:
        0 0 16px rgba(255,255,255,.08),
        0 0 30px rgba(var(--theme-c),.08);
    }

    .content{
      position:relative;
      z-index:4;
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      gap:10px;
    }

    .genres-wrap{
      display:flex;
      justify-content:center;
      margin-top:8px;
      flex:0 0 auto;
    }

    .genres{
      display:flex;
      align-items:center;
      gap:10px;
      overflow-x:auto;
      max-width:100%;
      padding:4px 2px 4px;
      scrollbar-width:none;
      -ms-overflow-style:none;
    }

    .genres::-webkit-scrollbar{
      display:none;
    }

    .genre{
      border:none;
      appearance:none;
      background:rgba(255,255,255,.025);
      color:rgba(255,255,255,.42);
      border:1px solid rgba(255,255,255,.055);
      border-radius:999px;
      min-width:82px;
      min-height:46px;
      padding:0 18px;
      font-size:15px;
      font-weight:500;
      letter-spacing:-.01em;
      cursor:pointer;
      transition:
        color .2s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .2s ease,
        transform .14s ease;
      white-space:nowrap;
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      position:relative;
      overflow:hidden;
      z-index:5;
    }

    .genre:active{
      transform:scale(.985);
    }

    .genre.active{
      color:#fff;
      background:rgba(255,255,255,.07);
      border-color:rgba(255,255,255,.16);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 0 0 1px rgba(255,255,255,.02);
    }

    .center{
      flex:1 1 auto;
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:0 8px;
    }

    .now-playing{
      width:100%;
      max-width:320px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:10px;
    }

    .drive-side,
    .drive-right{
      display:none;
    }

    .drive-badge{
      display:none;
    }

    .track-title{
      width:100%;
      font-size:clamp(38px, 11vw, 58px);
      line-height:.95;
      font-weight:600;
      letter-spacing:-.07em;
      color:#fff;
      word-break:break-word;
      text-wrap:balance;
      transition:opacity .2s ease, transform .2s ease;
      min-height:1.9em;
      display:flex;
      align-items:flex-end;
      justify-content:center;
    }

    .track-sub{
      min-height:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      color:rgba(255,255,255,.34);
      font-size:15px;
      font-weight:500;
      letter-spacing:-.01em;
    }

    .dot-sep{
      width:4px;
      height:4px;
      border-radius:50%;
      background:rgba(255,255,255,.18);
      flex:0 0 4px;
    }

    .micro{
      width:100%;
      height:42px;
      margin-top:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:none;
    }

    .micro-dots{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      min-width:54px;
      height:18px;
    }

    .micro-dot{
      width:5px;
      height:5px;
      border-radius:50%;
      background:rgba(255,255,255,.18);
      opacity:.42;
      transform:scale(1);
      transition:
        opacity .24s ease,
        transform .24s ease,
        background .24s ease,
        box-shadow .24s ease;
      box-shadow:none;
    }

    .micro-dot.live{
      background:rgba(255,255,255,.82);
      box-shadow:0 0 10px rgba(var(--theme-c),.20);
    }

    .swipe-hint{
      margin-top:6px;
      display:flex;
      align-items:center;
      gap:10px;
      color:rgba(255,255,255,.22);
      font-size:13px;
      font-weight:500;
      letter-spacing:-.01em;
      padding:8px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.02);
      border:1px solid rgba(255,255,255,.04);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
    }

    .swipe-arrow{
      color:rgba(255,255,255,.30);
      font-size:14px;
      line-height:1;
    }

    .bottom{
      flex:0 0 auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      padding-bottom:2px;
    }

    .controls{
      width:100%;
      max-width:320px;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:12px;
    }

    .nav-btn{
      width:52px;
      height:52px;
      border:none;
      background:transparent;
      color:rgba(255,255,255,.42);
      border-radius:50%;
      display:grid;
      place-items:center;
      cursor:pointer;
      transition:
        transform .14s ease,
        color .2s ease,
        background .2s ease;
      justify-self:center;
      position:relative;
      z-index:5;
      outline:none;
    }

    .nav-btn:hover{
      color:#fff;
      background:rgba(255,255,255,.035);
    }

    .nav-btn:active{
      transform:scale(.96);
    }

    .nav-btn.tap{
      transform:scale(.94);
      color:#fff;
      background:rgba(255,255,255,.045);
    }

    .play-btn{
      width:102px;
      height:102px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.10);
      background:
        radial-gradient(circle at 50% 34%, rgba(255,255,255,.07), rgba(255,255,255,.02) 55%, rgba(255,255,255,.01)),
        rgba(255,255,255,.02);
      color:#fff;
      display:grid;
      place-items:center;
      cursor:pointer;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.07),
        0 10px 30px rgba(0,0,0,.38);
      transition:
        transform .18s ease,
        box-shadow .22s ease,
        border-color .22s ease;
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      position:relative;
      z-index:5;
      outline:none;
    }

    .play-btn:active{
      transform:scale(.97);
    }

    .play-btn.playing{
      border-color:rgba(255,255,255,.14);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.09),
        0 12px 34px rgba(0,0,0,.44),
        0 0 20px rgba(var(--theme-c),.08);
    }

    .actions{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .action-btn{
      border:none;
      background:transparent;
      color:rgba(255,255,255,.42);
      font-size:14px;
      font-weight:500;
      letter-spacing:-.01em;
      padding:10px 14px;
      border-radius:999px;
      cursor:pointer;
      transition:color .2s ease, background .2s ease, transform .14s ease, border-color .2s ease;
      position:relative;
      z-index:5;
      border:1px solid rgba(255,255,255,.05);
      background:rgba(255,255,255,.02);
      outline:none;
    }

    .action-btn:hover{
      color:#fff;
      background:rgba(255,255,255,.03);
    }

    .action-btn:active{
      transform:scale(.985);
    }

    .action-btn.ready{
      color:#fff;
      border-color:rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);
    }

    .theme-panel{
      display:none;
    }

    .theme-chip{
      border:none;
      width:28px;
      height:28px;
      border-radius:50%;
      cursor:pointer;
      border:1px solid rgba(255,255,255,.16);
      box-shadow:0 0 0 1px rgba(255,255,255,.03);
      background:#fff;
      padding:0;
      transition:transform .15s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .theme-chip:active{
      transform:scale(.94);
    }

    .theme-chip.active{
      border-color:#fff;
      box-shadow:0 0 0 1px rgba(255,255,255,.10), 0 0 14px rgba(255,255,255,.10);
    }

    .theme-chip[data-theme="audi"]{
      background:linear-gradient(135deg, rgb(88,180,255), rgb(215,235,255));
    }

    .theme-chip[data-theme="porsche"]{
      background:linear-gradient(135deg, rgb(255,171,120), rgb(255,108,76));
    }

    .theme-chip[data-theme="bmw"]{
      background:linear-gradient(135deg, rgb(138,162,255), rgb(220,235,255));
    }

    .theme-chip[data-theme="stealth"]{
      background:linear-gradient(135deg, rgb(90,90,90), rgb(220,220,220));
    }

    .sheet-backdrop{
      position:fixed;
      inset:0;
      z-index:20;
      background:rgba(0,0,0,.42);
      opacity:0;
      pointer-events:none;
      transition:opacity .24s ease;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }

    .sheet-backdrop.open{
      opacity:1;
      pointer-events:auto;
    }

    .sheet{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:21;
      transform:translateY(104%);
      transition:transform .3s cubic-bezier(.2,.8,.2,1);
      padding:0 10px calc(env(safe-area-inset-bottom) + 10px);
      pointer-events:none;
    }

    .sheet.open{
      transform:translateY(0);
      pointer-events:auto;
    }

    .sheet-card{
      width:100%;
      max-width:430px;
      margin:0 auto;
      border-radius:30px 30px 22px 22px;
      background:linear-gradient(to bottom, rgba(22,22,22,.97), rgba(8,8,8,.98));
      border:1px solid rgba(255,255,255,.07);
      box-shadow:0 28px 80px rgba(0,0,0,.58);
      overflow:hidden;
    }

    .sheet-head{
      padding:12px 18px 10px;
      border-bottom:1px solid rgba(255,255,255,.06);
    }

    .sheet-handle{
      width:42px;
      height:5px;
      border-radius:999px;
      background:rgba(255,255,255,.14);
      margin:0 auto 12px;
    }

    .sheet-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      min-height:24px;
    }

    .sheet-title strong{
      font-size:15px;
      font-weight:600;
      letter-spacing:-.01em;
      color:#fff;
    }

    .sheet-title span{
      font-size:13px;
      color:rgba(255,255,255,.36);
    }

    .track-list{
      max-height:min(52vh, 430px);
      overflow:auto;
      padding:8px 10px 10px;
      scrollbar-width:none;
      -ms-overflow-style:none;
    }

    .track-list::-webkit-scrollbar{
      display:none;
    }

    .track-item{
      width:100%;
      border:none;
      background:transparent;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      text-align:left;
      padding:14px 12px;
      border-radius:16px;
      cursor:pointer;
      transition:background .18s ease, transform .14s ease;
    }

    .track-item:hover{
      background:rgba(255,255,255,.04);
    }

    .track-item:active{
      transform:scale(.995);
    }

    .track-item.active{
      background:rgba(255,255,255,.055);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
    }

    .track-item-main{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
      flex:1;
    }

    .track-index{
      width:24px;
      flex:0 0 24px;
      font-size:13px;
      font-weight:600;
      color:rgba(255,255,255,.26);
    }

    .track-name{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:15px;
      font-weight:500;
      letter-spacing:-.01em;
    }

    .track-item-meta{
      flex:0 0 auto;
      display:flex;
      align-items:center;
      gap:8px;
      color:rgba(255,255,255,.28);
      font-size:12px;
    }

    .playing-pill{
      width:8px;
      height:8px;
      border-radius:50%;
      background:rgba(255,255,255,.85);
      box-shadow:0 0 10px rgba(var(--theme-c),.24);
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:calc(env(safe-area-inset-bottom) + 116px);
      transform:translateX(-50%) translateY(10px);
      z-index:40;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.07);
      background:rgba(255,255,255,.08);
      color:#fff;
      font-size:13px;
      font-weight:500;
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      opacity:0;
      pointer-events:none;
      transition:opacity .22s ease, transform .22s ease;
      white-space:nowrap;
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    .landscape-drive .swipe-hint{
      display:none;
    }

    @media (orientation: landscape){
      .phone{
        max-width:100%;
        padding:
          calc(var(--safe-top) + 8px)
          26px
          calc(var(--safe-bottom) + 12px);
      }

      .landscape-drive .top{
        min-height:50px;
        justify-content:flex-start;
        align-items:flex-start;
      }

      .landscape-drive .logo{
        font-size:18px;
        letter-spacing:.32em;
      }

      .landscape-drive .content{
        display:grid;
        grid-template-columns:220px 1fr 180px;
        grid-template-rows:auto 1fr auto;
        gap:16px 18px;
        align-items:stretch;
      }

      .landscape-drive .genres-wrap{
        grid-column:1;
        grid-row:1 / span 3;
        margin-top:0;
        justify-content:flex-start;
        align-items:center;
      }

      .landscape-drive .genres{
        width:100%;
        flex-direction:column;
        align-items:stretch;
        gap:12px;
        overflow:visible;
        padding:0;
      }

      .landscape-drive .genre{
        min-width:unset;
        min-height:64px;
        width:100%;
        padding:0 22px;
        font-size:20px;
        font-weight:600;
        letter-spacing:.08em;
        justify-content:flex-start;
        text-align:left;
        background:rgba(255,255,255,.02);
        border-color:rgba(255,255,255,.08);
        border-radius:24px;
      }

      .landscape-drive .genre.active{
        background:linear-gradient(to right, rgba(var(--theme-a),.10), rgba(255,255,255,.05));
        border-color:rgba(var(--theme-c),.22);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,.05),
          0 0 22px rgba(var(--theme-a),.08);
      }

      .landscape-drive .center{
        grid-column:2;
        grid-row:1 / span 2;
        padding:0;
      }

      .landscape-drive .now-playing{
        max-width:none;
        width:100%;
        height:100%;
        justify-content:center;
        gap:14px;
      }

      .landscape-drive .drive-badge{
        display:inline-flex;
        align-items:center;
        justify-content:center;
        padding:8px 14px;
        border-radius:999px;
        border:1px solid rgba(255,255,255,.08);
        background:rgba(255,255,255,.025);
        color:rgba(255,255,255,.40);
        font-size:12px;
        font-weight:600;
        letter-spacing:.18em;
        text-transform:uppercase;
      }

      .landscape-drive .track-title{
        font-size:clamp(46px, 6vw, 82px);
        min-height:1.2em;
        letter-spacing:-.065em;
      }

      .landscape-drive .track-sub{
        font-size:20px;
        color:rgba(255,255,255,.42);
      }

      .landscape-drive .micro{
        height:54px;
        margin-top:4px;
      }

      .landscape-drive .micro-dot{
        width:8px;
        height:8px;
      }

      .landscape-drive .bottom{
        grid-column:2;
        grid-row:3;
        gap:16px;
        padding-bottom:0;
      }

      .landscape-drive .controls{
        max-width:520px;
        grid-template-columns:92px 1fr 92px;
        gap:18px;
      }

      .landscape-drive .nav-btn{
        width:78px;
        height:78px;
        border-radius:22px;
        background:rgba(255,255,255,.02);
        border:1px solid rgba(255,255,255,.05);
      }

      .landscape-drive .nav-btn svg{
        width:34px;
        height:34px;
      }

      .landscape-drive .play-btn{
        width:134px;
        height:134px;
      }

      .landscape-drive .play-btn svg{
        width:42px;
        height:42px;
      }

      .landscape-drive .actions{
        gap:12px;
      }

      .landscape-drive .action-btn{
        min-height:48px;
        padding:0 18px;
        font-size:15px;
      }

      .landscape-drive .drive-right{
        display:flex;
        grid-column:3;
        grid-row:1 / span 3;
        flex-direction:column;
        justify-content:space-between;
        gap:16px;
      }

      .landscape-drive .theme-panel{
        display:flex;
        flex-direction:column;
        gap:12px;
        padding:16px;
        border-radius:24px;
        border:1px solid rgba(255,255,255,.07);
        background:rgba(255,255,255,.03);
        backdrop-filter:blur(10px);
        -webkit-backdrop-filter:blur(10px);
      }

      .landscape-drive .theme-panel-title{
        color:rgba(255,255,255,.38);
        font-size:12px;
        font-weight:600;
        letter-spacing:.16em;
        text-transform:uppercase;
      }

      .landscape-drive .theme-row{
        display:flex;
        gap:10px;
        flex-wrap:wrap;
      }

      .landscape-drive .drive-side{
        display:flex;
        flex-direction:column;
        gap:12px;
        padding:16px;
        border-radius:24px;
        border:1px solid rgba(255,255,255,.07);
        background:rgba(255,255,255,.03);
        backdrop-filter:blur(10px);
        -webkit-backdrop-filter:blur(10px);
      }

      .landscape-drive .drive-side-title{
        color:rgba(255,255,255,.38);
        font-size:12px;
        font-weight:600;
        letter-spacing:.16em;
        text-transform:uppercase;
      }

      .landscape-drive .drive-side-value{
        color:#fff;
        font-size:28px;
        font-weight:600;
        letter-spacing:-.04em;
      }

      .landscape-drive .drive-side-meta{
        color:rgba(255,255,255,.34);
        font-size:14px;
        font-weight:500;
      }

      .landscape-drive .sheet-card{
        max-width:900px;
      }
    }

    @media (min-width:431px){
      .phone{
        box-shadow:0 0 70px rgba(0,0,0,.34);
      }
    }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>

  <div class="app">
    <div class="phone" id="phone">
      <div class="gesture-layer" id="gestureLayer" aria-hidden="true"></div>

      <div class="top">
        <div class="logo" id="logo">RESONANCE</div>
      </div>

      <div class="content">
        <div class="genres-wrap">
          <div class="genres" id="genres"></div>
        </div>

        <div class="center">
          <div class="now-playing">
            <div class="drive-badge" id="driveBadge">Drive Mode</div>

            <div class="track-title" id="trackTitle">lofi 1</div>

            <div class="track-sub">
              <span id="trackCounter">1 / 1</span>
              <span class="dot-sep"></span>
              <span id="trackTime">00:00</span>
            </div>

            <div class="micro" aria-hidden="true">
              <div class="micro-dots">
                <span class="micro-dot" id="dot1"></span>
                <span class="micro-dot" id="dot2"></span>
                <span class="micro-dot" id="dot3"></span>
              </div>
            </div>

            <div class="swipe-hint">
              <span class="swipe-arrow">←</span>
              <span>свайп по экрану</span>
              <span class="swipe-arrow">→</span>
            </div>
          </div>
        </div>

        <div class="bottom">
          <div class="controls">
            <button class="nav-btn" id="prevBtn" aria-label="Предыдущий трек">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M15.5 18L9.5 12L15.5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>

            <button class="play-btn" id="playBtn" aria-label="Воспроизвести или пауза">
              <svg id="playIcon" width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 6.7v10.6c0 .7.8 1.14 1.4.78l7.9-5.3a.93.93 0 0 0 0-1.56l-7.9-5.3A.93.93 0 0 0 9 6.7Z" fill="currentColor"/>
              </svg>
            </button>

            <button class="nav-btn" id="nextBtn" aria-label="Следующий трек">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M8.5 18L14.5 12L8.5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>

          <div class="actions">
            <button class="action-btn" id="offlineBtn">Скачать офлайн</button>
            <button class="action-btn" id="queueTrigger">Список треков</button>
          </div>
        </div>

        <div class="drive-right">
          <div class="theme-panel">
            <div class="theme-panel-title">Interior Theme</div>
            <div class="theme-row">
              <button class="theme-chip active" data-theme="audi" aria-label="Audi Blue"></button>
              <button class="theme-chip" data-theme="porsche" aria-label="Porsche Amber"></button>
              <button class="theme-chip" data-theme="bmw" aria-label="BMW Ice"></button>
              <button class="theme-chip" data-theme="stealth" aria-label="Stealth"></button>
            </div>
          </div>

          <div class="drive-side">
            <div class="drive-side-title">Driver View</div>
            <div class="drive-side-value" id="driveGenreLabel">Lo-Fi</div>
            <div class="drive-side-meta" id="driveOfflineStatus">Онлайн</div>
          </div>

          <div class="drive-side">
            <div class="drive-side-title">Gesture</div>
            <div class="drive-side-value">← →</div>
            <div class="drive-side-meta">Свайп по экрану для треков</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>

  <div class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-card">
      <div class="sheet-head">
        <div class="sheet-handle"></div>
        <div class="sheet-title">
          <strong id="sheetTitle">Треки</strong>
          <span id="sheetMeta">0</span>
        </div>
      </div>
      <div class="track-list" id="trackList"></div>
    </div>
  </div>

  <div class="toast" id="toast">Готово</div>

  <audio id="audio" preload="metadata" playsinline webkit-playsinline></audio>

  <script>
    const APP_NAME = "RESONANCE";
    const TRACK_CACHE = "resonance-track-cache-v1";
    const MANIFEST_KEY = "resonance-local-manifest-v1";
    const THEME_KEY = "resonance-drive-theme-v1";

    const GENRES = [
      { id: "lofi", name: "Lo-Fi", prefix: "lofi", maxFiles: 100 },
      { id: "rap",  name: "Rap",   prefix: "rap",  maxFiles: 100 },
      { id: "jazz", name: "Jazz",  prefix: "jazz", maxFiles: 100 }
    ];

    const THEMES = {
      audi:    { a: "110,200,255", b: "255,150,120", c: "185,232,255" },
      porsche: { a: "255,181,120", b: "255,105,74",  c: "255,220,180" },
      bmw:     { a: "128,160,255", b: "120,215,255", c: "215,235,255" },
      stealth: { a: "205,205,205", b: "118,118,118", c: "245,245,245" }
    };

    const phone = document.getElementById("phone");
    const audio = document.getElementById("audio");
    const genresEl = document.getElementById("genres");
    const playBtn = document.getElementById("playBtn");
    const playIcon = document.getElementById("playIcon");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const logo = document.getElementById("logo");

    const trackTitleEl = document.getElementById("trackTitle");
    const trackCounterEl = document.getElementById("trackCounter");
    const trackTimeEl = document.getElementById("trackTime");

    const offlineBtn = document.getElementById("offlineBtn");
    const queueTrigger = document.getElementById("queueTrigger");
    const sheet = document.getElementById("sheet");
    const sheetBackdrop = document.getElementById("sheetBackdrop");
    const sheetTitle = document.getElementById("sheetTitle");
    const sheetMeta = document.getElementById("sheetMeta");
    const trackListEl = document.getElementById("trackList");
    const toastEl = document.getElementById("toast");
    const gestureLayer = document.getElementById("gestureLayer");

    const dot1 = document.getElementById("dot1");
    const dot2 = document.getElementById("dot2");
    const dot3 = document.getElementById("dot3");

    const driveGenreLabel = document.getElementById("driveGenreLabel");
    const driveOfflineStatus = document.getElementById("driveOfflineStatus");

    const canvas = document.getElementById("bgCanvas");
    const ctx = canvas.getContext("2d", { alpha: true });

    let currentGenre = GENRES[0];
    let currentTrackList = [];
    let currentLocalIndex = 0;
    let currentTrackTitle = "lofi 1";
    let sheetOpen = false;
    let toastTimer = null;

    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;
    let lastTap = 0;

    let fakeEnergy = 0.06;
    let bgPulse = 0;
    let cachedManifest = loadManifest();
    let currentObjectUrl = null;
    let currentTheme = localStorage.getItem(THEME_KEY) || "audi";

    const localTrackCache = {};

    const particles = Array.from({ length: 34 }, () => ({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 1.8 + 0.5,
      a: Math.random() * .12 + .03,
      drift: Math.random() * .18 + .05
    }));

    function loadManifest(){
      try{
        return JSON.parse(localStorage.getItem(MANIFEST_KEY) || "{}");
      }catch(e){
        return {};
      }
    }

    function saveManifest(){
      localStorage.setItem(MANIFEST_KEY, JSON.stringify(cachedManifest));
    }

    function applyTheme(name){
      const theme = THEMES[name] || THEMES.audi;
      currentTheme = name;
      localStorage.setItem(THEME_KEY, name);

      document.documentElement.style.setProperty("--theme-a", theme.a);
      document.documentElement.style.setProperty("--theme-b", theme.b);
      document.documentElement.style.setProperty("--theme-c", theme.c);

      document.querySelectorAll(".theme-chip").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.theme === name);
      });
    }

    function updateOrientationMode(){
      const isLandscape = window.matchMedia("(orientation: landscape)").matches;
      phone.classList.toggle("landscape-drive", isLandscape);
    }

    function createManifest(){
      const iconSVG = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <rect width="512" height="512" rx="120" fill="#000"/>
          <text x="256" y="282" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="54" letter-spacing="12">R</text>
        </svg>
      `;
      const iconURL = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(iconSVG);

      const manifest = {
        name: APP_NAME,
        short_name: APP_NAME,
        start_url: "./",
        display: "standalone",
        background_color: "#000000",
        theme_color: "#000000",
        icons: [
          { src: iconURL, sizes: "192x192", type: "image/svg+xml", purpose: "any" },
          { src: iconURL, sizes: "512x512", type: "image/svg+xml", purpose: "any" }
        ]
      };

      const manifestBlob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
      const manifestURL = URL.createObjectURL(manifestBlob);
      const link = document.createElement("link");
      link.rel = "manifest";
      link.href = manifestURL;
      document.head.appendChild(link);
    }

    async function registerSW(){
      if (!("serviceWorker" in navigator)) return;
      if (location.protocol === "file:") return;
      try{
        await navigator.serviceWorker.register("./sw.js");
      }catch(e){}
    }

    function setPlayIcon(paused){
      playIcon.innerHTML = paused
        ? '<path d="M9 6.7v10.6c0 .7.8 1.14 1.4.78l7.9-5.3a.93.93 0 0 0 0-1.56l-7.9-5.3A.93.93 0 0 0 9 6.7Z" fill="currentColor"/>'
        : '<path d="M8 6.5v11M16 6.5v11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';

      playBtn.classList.toggle("playing", !paused);
      logo.classList.toggle("playing", !paused);
    }

    function showToast(text){
      clearTimeout(toastTimer);
      toastEl.textContent = text;
      toastEl.classList.add("show");
      toastTimer = setTimeout(() => {
        toastEl.classList.remove("show");
      }, 1500);
    }

    function openSheet(){
      sheetOpen = true;
      sheet.classList.add("open");
      sheetBackdrop.classList.add("open");
      sheet.setAttribute("aria-hidden", "false");
      renderTrackList();
    }

    function closeSheet(){
      sheetOpen = false;
      sheet.classList.remove("open");
      sheetBackdrop.classList.remove("open");
      sheet.setAttribute("aria-hidden", "true");
    }

    function escapeHtml(text){
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function stripExtension(name){
      return name.replace(/\.[^/.]+$/, "");
    }

    function buildTrackTitle(genre, index, url){
      try{
        const fileName = decodeURIComponent(url.split("/").pop() || "");
        const clean = stripExtension(fileName);
        if (clean) return clean.replace(/[-_]+/g, " ");
      }catch(e){}
      return `${genre.name} ${index + 1}`;
    }

    function renderGenres(){
      genresEl.innerHTML = "";

      GENRES.forEach((genre) => {
        const button = document.createElement("button");
        button.className = "genre";
        button.dataset.genreId = genre.id;
        button.textContent = genre.name;

        if (genre.id === currentGenre.id) button.classList.add("active");

        button.addEventListener("click", async () => {
          await selectGenre(genre, true);
        });

        genresEl.appendChild(button);
      });
    }

    function updateNowPlayingUI(){
      trackTitleEl.style.opacity = ".72";
      trackTitleEl.style.transform = "translateY(2px)";

      requestAnimationFrame(() => {
        trackTitleEl.textContent = currentTrackTitle;
        trackTitleEl.style.opacity = "1";
        trackTitleEl.style.transform = "translateY(0)";
      });

      trackCounterEl.textContent = currentTrackList.length
        ? `${currentLocalIndex + 1} / ${currentTrackList.length}`
        : "—";

      sheetTitle.textContent = currentGenre.name;
      sheetMeta.textContent = `${currentTrackList.length} треков`;
      driveGenreLabel.textContent = currentGenre.name;
    }

    function renderTrackList(){
      trackListEl.innerHTML = "";

      currentTrackList.forEach((url, index) => {
        const item = document.createElement("button");
        item.className = "track-item";
        if (index === currentLocalIndex) item.classList.add("active");

        const visibleName = buildTrackTitle(currentGenre, index, url);

        item.innerHTML = `
          <span class="track-item-main">
            <span class="track-index">${String(index + 1).padStart(2, "0")}</span>
            <span class="track-name">${escapeHtml(visibleName)}</span>
          </span>
          <span class="track-item-meta">
            ${index === currentLocalIndex ? '<span class="playing-pill"></span>' : ''}
          </span>
        `;

        item.addEventListener("click", async () => {
          currentLocalIndex = index;
          await loadCurrentLocalTrack(true);
          closeSheet();
        });

        trackListEl.appendChild(item);
      });
    }

    async function fileExists(url){
      if (!navigator.onLine) return false;

      try{
        const head = await fetch(url, { method: "HEAD", cache: "no-store" });
        if (head.ok) return true;
      }catch(e){}

      try{
        const range = await fetch(url, {
          method: "GET",
          headers: { Range: "bytes=0-0" },
          cache: "no-store"
        });
        return range.ok || range.status === 206;
      }catch(e){
        return false;
      }
    }

    async function getLocalTracksForGenre(genre){
      if (localTrackCache[genre.id]) return localTrackCache[genre.id];

      if (cachedManifest[genre.id]?.length){
        localTrackCache[genre.id] = cachedManifest[genre.id];
      }

      if (!navigator.onLine && localTrackCache[genre.id]?.length){
        return localTrackCache[genre.id];
      }

      const tracks = [];

      for (let i = 1; i <= genre.maxFiles; i++){
        const url = `./${genre.prefix}-${i}.mp3`;
        const exists = await fileExists(url);

        if (exists) {
          tracks.push(url);
        } else {
          break;
        }
      }

      if (tracks.length){
        localTrackCache[genre.id] = tracks;
        cachedManifest[genre.id] = tracks;
        saveManifest();
      }

      return localTrackCache[genre.id] || tracks;
    }

    async function getCache(){
      if (!("caches" in window)) return null;
      try{
        return await caches.open(TRACK_CACHE);
      }catch(e){
        return null;
      }
    }

    async function isGenreCachedOffline(genre){
      const urls = cachedManifest[genre.id] || localTrackCache[genre.id] || [];
      if (!urls.length) return false;

      const cache = await getCache();
      if (!cache) return false;

      for (const url of urls){
        const match = await cache.match(url);
        if (!match) return false;
      }
      return true;
    }

    async function updateOfflineButton(){
      const ready = await isGenreCachedOffline(currentGenre);
      offlineBtn.classList.toggle("ready", ready);
      offlineBtn.textContent = ready ? "Офлайн готов" : "Скачать офлайн";
      driveOfflineStatus.textContent = ready ? "Офлайн готов" : "Онлайн";
    }

    async function cacheGenreOffline(genre){
      const urls = await getLocalTracksForGenre(genre);
      if (!urls.length){
        showToast("Нет треков для сохранения");
        return;
      }

      const cache = await getCache();
      if (!cache){
        showToast("Офлайн недоступен");
        return;
      }

      offlineBtn.textContent = "Скачивание…";
      offlineBtn.disabled = true;

      try{
        for (const url of urls){
          const existing = await cache.match(url);
          if (existing) continue;

          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) throw new Error("download failed");
          await cache.put(url, res.clone());
        }

        await updateOfflineButton();
        showToast("Жанр сохранён офлайн");
      }catch(e){
        showToast("Не удалось скачать");
      }finally{
        offlineBtn.disabled = false;
      }
    }

    async function resolvePlayableSrc(url){
      if (currentObjectUrl){
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }

      if (navigator.onLine) return url;

      const cache = await getCache();
      if (!cache) return url;

      const match = await cache.match(url);
      if (!match) return url;

      const blob = await match.blob();
      currentObjectUrl = URL.createObjectURL(blob);
      return currentObjectUrl;
    }

    async function selectGenre(genre, autoplay = true){
      currentGenre = genre;
      renderGenres();
      closeSheet();

      currentTrackList = await getLocalTracksForGenre(genre);

      if (!currentTrackList.length){
        currentTrackTitle = genre.name;
        updateNowPlayingUI();
        trackTimeEl.textContent = navigator.onLine ? "Нет файлов" : "Нет офлайна";
        audio.pause();
        audio.removeAttribute("src");
        audio.load();
        setPlayIcon(true);
        renderTrackList();
        await updateOfflineButton();
        showToast(navigator.onLine ? "Файлы не найдены" : "Сначала скачай жанр");
        return;
      }

      currentLocalIndex = 0;
      await loadCurrentLocalTrack(autoplay);
      await updateOfflineButton();
    }

    async function loadCurrentLocalTrack(autoplay = true){
      if (!currentTrackList.length) return;

      const url = currentTrackList[currentLocalIndex];
      const resolvedSrc = await resolvePlayableSrc(url);

      audio.src = resolvedSrc;
      currentTrackTitle = buildTrackTitle(currentGenre, currentLocalIndex, url);
      audio.load();

      updateNowPlayingUI();
      renderTrackList();

      if (autoplay) await safePlay();
      updateMediaSession();
    }

    async function nextTrack(){
      if (!currentTrackList.length) return;
      currentLocalIndex = (currentLocalIndex + 1) % currentTrackList.length;
      await loadCurrentLocalTrack(true);
    }

    async function prevTrack(){
      if (!currentTrackList.length) return;
      currentLocalIndex = (currentLocalIndex - 1 + currentTrackList.length) % currentTrackList.length;
      await loadCurrentLocalTrack(true);
    }

    async function ensurePlaybackHints(){
      try{
        if ("audioSession" in navigator && navigator.audioSession){
          navigator.audioSession.type = "playback";
        }
      }catch(e){}
    }

    async function safePlay(){
      try{
        await ensurePlaybackHints();
        await audio.play();
      }catch(e){
        if (!navigator.onLine){
          showToast("Трек не сохранён офлайн");
        }
      }
    }

    function formatTime(seconds){
      if (!Number.isFinite(seconds) || seconds < 0) return "00:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function updateTime(){
      trackTimeEl.textContent = formatTime(audio.currentTime || 0);
    }

    function createArtworkDataURL(text){
      const safe = String(text || APP_NAME).slice(0, 24);
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <rect width="512" height="512" rx="96" fill="#000"/>
          <text x="256" y="270" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="42" letter-spacing="10">${safe}</text>
        </svg>
      `);
    }

    function updateMediaSession(){
      if (!("mediaSession" in navigator)) return;

      navigator.mediaSession.metadata = new MediaMetadata({
        title: currentTrackTitle || currentGenre?.name || APP_NAME,
        artist: currentGenre?.name || APP_NAME,
        album: APP_NAME,
        artwork: [{
          src: createArtworkDataURL(currentGenre?.name || APP_NAME),
          sizes: "512x512",
          type: "image/svg+xml"
        }]
      });

      navigator.mediaSession.setActionHandler("play", async () => { await safePlay(); });
      navigator.mediaSession.setActionHandler("pause", () => audio.pause());

      try{
        navigator.mediaSession.setActionHandler("nexttrack", async () => { await nextTrack(); });
      }catch(e){}

      try{
        navigator.mediaSession.setActionHandler("previoustrack", async () => { await prevTrack(); });
      }catch(e){}

      updateMediaSessionPlayback();
    }

    function updateMediaSessionPlayback(){
      if ("mediaSession" in navigator) {
        navigator.mediaSession.playbackState = audio.paused ? "paused" : "playing";
      }
    }

    function tapButton(btn){
      btn.classList.add("tap");
      btn.blur();
      setTimeout(() => btn.classList.remove("tap"), 140);
    }

    playBtn.addEventListener("click", togglePlayback);

    prevBtn.addEventListener("click", async () => {
      tapButton(prevBtn);
      await prevTrack();
    });

    nextBtn.addEventListener("click", async () => {
      tapButton(nextBtn);
      await nextTrack();
    });

    offlineBtn.addEventListener("click", async () => {
      await cacheGenreOffline(currentGenre);
    });

    queueTrigger.addEventListener("click", () => {
      if (sheetOpen) closeSheet();
      else openSheet();
    });

    sheetBackdrop.addEventListener("click", closeSheet);

    async function togglePlayback(){
      if (!audio.src){
        await selectGenre(currentGenre || GENRES[0], true);
        return;
      }

      if (audio.paused) await safePlay();
      else audio.pause();
    }

    audio.addEventListener("play", () => {
      setPlayIcon(false);
      updateMediaSessionPlayback();
    });

    audio.addEventListener("pause", () => {
      setPlayIcon(true);
      updateMediaSessionPlayback();
    });

    audio.addEventListener("ended", async () => {
      await nextTrack();
    });

    audio.addEventListener("error", async () => {
      if (!navigator.onLine){
        showToast("Трек не сохранён офлайн");
        return;
      }
      await nextTrack();
    });

    audio.addEventListener("loadedmetadata", updateTime);
    audio.addEventListener("timeupdate", updateTime);

    function resizeCanvas(){
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(innerWidth * dpr);
      canvas.height = Math.floor(innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener("resize", () => {
      resizeCanvas();
      updateOrientationMode();
    });
    resizeCanvas();

    function getEnergy(){
      const t = performance.now() * 0.001;
      const boost = !audio.paused && audio.src ? .14 : 0;
      fakeEnergy += (((0.025 + Math.sin(t * 1.5) * 0.012) + boost) - fakeEnergy) * 0.05;
      return Math.max(0.025, fakeEnergy);
    }

    function updateQuietPulse(time){
      const t = time * 0.001;
      const e = getEnergy();

      if (audio.paused || !audio.src){
        [dot1, dot2, dot3].forEach((d) => {
          d.classList.remove("live");
          d.style.transform = "scale(1)";
          d.style.opacity = ".42";
        });
        return;
      }

      const a = 0.92 + Math.sin(t * 2.4) * 0.10 + e * 0.12;
      const b = 1.06 + Math.sin(t * 2.4 + 0.7) * 0.12 + e * 0.16;
      const c = 0.92 + Math.sin(t * 2.4 + 1.4) * 0.10 + e * 0.12;

      dot1.classList.add("live");
      dot2.classList.add("live");
      dot3.classList.add("live");

      dot1.style.transform = `scale(${a})`;
      dot2.style.transform = `scale(${b})`;
      dot3.style.transform = `scale(${c})`;

      dot1.style.opacity = String(0.42 + e * 0.8);
      dot2.style.opacity = String(0.52 + e * 0.9);
      dot3.style.opacity = String(0.42 + e * 0.8);
    }

    function drawBackground(time){
      const t = time * 0.001;
      const w = innerWidth;
      const h = innerHeight;
      const e = getEnergy();

      ctx.clearRect(0, 0, w, h);
      bgPulse += ((0.18 + e * 0.9) - bgPulse) * 0.05;

      const themeA = getComputedStyle(document.documentElement).getPropertyValue("--theme-a").trim();
      const themeB = getComputedStyle(document.documentElement).getPropertyValue("--theme-b").trim();
      const themeC = getComputedStyle(document.documentElement).getPropertyValue("--theme-c").trim();

      const isLandscape = window.matchMedia("(orientation: landscape)").matches;

      const sphere1 = ctx.createRadialGradient(
        w * (isLandscape ? 0.46 : 0.30),
        h * (isLandscape ? 0.30 : 0.30),
        0,
        w * (isLandscape ? 0.46 : 0.30),
        h * (isLandscape ? 0.30 : 0.30),
        Math.min(w, h) * (isLandscape ? 0.48 : 0.38)
      );
      sphere1.addColorStop(0, `rgba(${themeA},${0.12 + bgPulse * 0.16})`);
      sphere1.addColorStop(0.35, `rgba(${themeA},${0.05 + bgPulse * 0.07})`);
      sphere1.addColorStop(1, `rgba(${themeA},0)`);
      ctx.fillStyle = sphere1;
      ctx.fillRect(0, 0, w, h);

      const sphere2 = ctx.createRadialGradient(
        w * (isLandscape ? 0.72 : 0.77),
        h * (isLandscape ? 0.58 : 0.68),
        0,
        w * (isLandscape ? 0.72 : 0.77),
        h * (isLandscape ? 0.58 : 0.68),
        Math.min(w, h) * (isLandscape ? 0.52 : 0.42)
      );
      sphere2.addColorStop(0, `rgba(${themeB},${0.10 + bgPulse * 0.15})`);
      sphere2.addColorStop(0.34, `rgba(${themeB},${0.04 + bgPulse * 0.06})`);
      sphere2.addColorStop(1, `rgba(${themeB},0)`);
      ctx.fillStyle = sphere2;
      ctx.fillRect(0, 0, w, h);

      const sphere3 = ctx.createRadialGradient(
        w * (isLandscape ? 0.58 : 0.58),
        h * (isLandscape ? 0.48 : 0.52),
        0,
        w * (isLandscape ? 0.58 : 0.58),
        h * (isLandscape ? 0.48 : 0.52),
        Math.min(w, h) * (isLandscape ? 0.26 : 0.22)
      );
      sphere3.addColorStop(0, `rgba(${themeC},${0.07 + e * 0.12})`);
      sphere3.addColorStop(0.4, `rgba(${themeC},${0.02 + e * 0.05})`);
      sphere3.addColorStop(1, `rgba(${themeC},0)`);
      ctx.fillStyle = sphere3;
      ctx.fillRect(0, 0, w, h);

      const lineY = h * .50;
      const line = ctx.createLinearGradient(w * .18, lineY, w * .82, lineY);
      line.addColorStop(0, `rgba(${themeA},0)`);
      line.addColorStop(.5, `rgba(255,255,255,${0.05 + e * 0.09})`);
      line.addColorStop(1, `rgba(${themeB},0)`);
      ctx.fillStyle = line;
      ctx.fillRect(w * .18, lineY - .5, w * .64, 1);

      if (isLandscape){
        const lane = ctx.createLinearGradient(w * 0.50, 0, w * 0.78, 0);
        lane.addColorStop(0, `rgba(${themeA},0)`);
        lane.addColorStop(.55, `rgba(${themeA},${0.07 + e * 0.10})`);
        lane.addColorStop(1, `rgba(${themeB},0)`);
        ctx.fillStyle = lane;
        ctx.fillRect(w * 0.42, h * 0.16, w * 0.30, h * 0.68);
      }

      for (const p of particles){
        const x = p.x * w + Math.sin(t * p.drift + p.y * 8) * 8;
        const y = p.y * h + Math.cos(t * p.drift + p.x * 7) * 8;

        ctx.beginPath();
        ctx.arc(x, y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${p.a * (0.9 + bgPulse * 1.1)})`;
        ctx.fill();
      }

      updateQuietPulse(time);
      requestAnimationFrame(drawBackground);
    }

    function setupGestures(){
      gestureLayer.addEventListener("touchstart", (e) => {
        const t = e.touches[0];
        touchStartX = t.clientX;
        touchStartY = t.clientY;
        touchStartTime = Date.now();

        const now = Date.now();
        if (now - lastTap < 260){
          togglePlayback();
        }
        lastTap = now;
      }, { passive:true });

      gestureLayer.addEventListener("touchend", async (e) => {
        const t = e.changedTouches[0];
        const dx = t.clientX - touchStartX;
        const dy = t.clientY - touchStartY;
        const dt = Date.now() - touchStartTime;

        if (dt > 700) return;

        const absX = Math.abs(dx);
        const absY = Math.abs(dy);

        if (absX < 20 && absY < 20) return;

        if (absX > absY && absX > 48){
          if (dx < 0) await nextTrack();
          else await prevTrack();
          return;
        }

        if (absY > absX && absY > 58){
          if (dy < 0) openSheet();
          else closeSheet();
        }
      }, { passive:true });

      window.addEventListener("keydown", async (e) => {
        if (e.key === "ArrowRight") await nextTrack();
        if (e.key === "ArrowLeft") await prevTrack();
        if (e.key === " "){
          e.preventDefault();
          await togglePlayback();
        }
        if (e.key === "Escape") closeSheet();
      });
    }

    function initWarmup(){
      ["touchstart", "click"].forEach((evt) => {
        window.addEventListener(evt, async () => {
          await ensurePlaybackHints();
        }, { once:true, passive:true });
      });
    }

    function initThemes(){
      document.querySelectorAll(".theme-chip").forEach(btn => {
        btn.addEventListener("click", () => applyTheme(btn.dataset.theme));
      });
      applyTheme(currentTheme);
    }

    async function init(){
      createManifest();
      await registerSW();
      initThemes();
      renderGenres();
      setPlayIcon(true);
      updateNowPlayingUI();
      updateTime();
      updateOrientationMode();
      requestAnimationFrame(drawBackground);
      setupGestures();
      initWarmup();
      await selectGenre(currentGenre, false);
    }

    init();
  </script>
</body>
</html>
