<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>RESONANCE</title>

  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RESONANCE" />

  <style>
    :root{
      --bg:#000;
      --text:#fff;
      --muted:rgba(255,255,255,.34);
      --muted-2:rgba(255,255,255,.18);
      --line:rgba(255,255,255,.08);
      --panel:rgba(255,255,255,.04);
      --panel-2:rgba(255,255,255,.06);
      --safe-top:max(14px, env(safe-area-inset-top));
      --safe-bottom:max(18px, env(safe-area-inset-bottom));

      --theme-a:110,200,255;
      --theme-b:255,150,120;
      --theme-c:185,232,255;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      user-select:none;
      -webkit-user-select:none;
    }

    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:#000;
      color:var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Inter",
        "Helvetica Neue",
        Arial,
        sans-serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      text-rendering:optimizeLegibility;
    }

    body{
      position:relative;
      background:#000;
    }

    #bgCanvas{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      z-index:0;
      pointer-events:none;
    }

    .app{
      position:relative;
      z-index:2;
      width:100%;
      height:100%;
      display:flex;
      justify-content:center;
      align-items:stretch;
    }

    .shell{
      width:100%;
      max-width:430px;
      height:100%;
      position:relative;
      overflow:hidden;
      padding:
        calc(var(--safe-top) + 6px)
        22px
        calc(var(--safe-bottom) + 16px);
      transition:max-width .25s ease, padding .25s ease;
    }

    .gesture-layer{
      position:absolute;
      inset:0;
      z-index:3;
      background:transparent;
    }

    .logo{
      font-size:20px;
      font-weight:300;
      letter-spacing:.34em;
      color:rgba(255,255,255,.84);
      white-space:nowrap;
      transition:text-shadow .25s ease;
    }

    .logo.playing{
      text-shadow:
        0 0 16px rgba(255,255,255,.08),
        0 0 28px rgba(var(--theme-c),.08);
    }

    .hidden{
      display:none !important;
    }

    /* ---------- shared ---------- */

    .genre{
      border:none;
      appearance:none;
      background:rgba(255,255,255,.025);
      color:rgba(255,255,255,.42);
      border:1px solid rgba(255,255,255,.055);
      border-radius:999px;
      cursor:pointer;
      transition:
        color .2s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .2s ease,
        transform .14s ease;
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
    }

    .genre:active{
      transform:scale(.985);
    }

    .genre.active{
      color:#fff;
      background:rgba(255,255,255,.07);
      border-color:rgba(255,255,255,.16);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 0 0 1px rgba(255,255,255,.02);
    }

    .nav-btn{
      border:none;
      background:transparent;
      color:rgba(255,255,255,.42);
      cursor:pointer;
      transition:transform .14s ease, color .2s ease, background .2s ease;
      outline:none;
    }

    .nav-btn:active{ transform:scale(.96); }
    .nav-btn.tap{
      transform:scale(.94);
      color:#fff;
      background:rgba(255,255,255,.045);
    }

    .play-btn{
      border:1px solid rgba(255,255,255,.10);
      background:
        radial-gradient(circle at 50% 34%, rgba(255,255,255,.07), rgba(255,255,255,.02) 55%, rgba(255,255,255,.01)),
        rgba(255,255,255,.02);
      color:#fff;
      display:grid;
      place-items:center;
      cursor:pointer;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.07),
        0 10px 30px rgba(0,0,0,.38);
      transition:transform .18s ease, box-shadow .22s ease, border-color .22s ease;
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      outline:none;
    }

    .play-btn:active{ transform:scale(.97); }

    .play-btn.playing{
      border-color:rgba(255,255,255,.14);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.09),
        0 12px 34px rgba(0,0,0,.44),
        0 0 20px rgba(var(--theme-c),.08);
    }

    .action-btn{
      border:none;
      background:rgba(255,255,255,.02);
      color:rgba(255,255,255,.42);
      border:1px solid rgba(255,255,255,.05);
      border-radius:999px;
      cursor:pointer;
      transition:color .2s ease, background .2s ease, transform .14s ease, border-color .2s ease;
      outline:none;
    }

    .action-btn:hover{
      color:#fff;
      background:rgba(255,255,255,.03);
    }

    .action-btn:active{ transform:scale(.985); }

    .action-btn.ready{
      color:#fff;
      border-color:rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);
    }

    .micro-dots{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }

    .micro-dot{
      width:6px;
      height:6px;
      border-radius:50%;
      background:rgba(255,255,255,.18);
      opacity:.42;
      transform:scale(1);
      transition:
        opacity .24s ease,
        transform .24s ease,
        background .24s ease,
        box-shadow .24s ease;
    }

    .micro-dot.live{
      background:rgba(255,255,255,.82);
      box-shadow:0 0 10px rgba(var(--theme-c),.20);
    }

    /* ---------- portrait ---------- */

    .portrait{
      position:relative;
      z-index:4;
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      gap:10px;
    }

    .portrait-top{
      min-height:72px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
    }

    .portrait-genres-wrap{
      display:flex;
      justify-content:center;
      margin-top:8px;
    }

    .portrait-genres{
      display:flex;
      gap:10px;
      overflow-x:auto;
      scrollbar-width:none;
      -ms-overflow-style:none;
      padding:4px 2px;
    }

    .portrait-genres::-webkit-scrollbar{ display:none; }

    .portrait .genre{
      min-width:82px;
      min-height:46px;
      padding:0 18px;
      font-size:15px;
      font-weight:500;
    }

    .portrait-center{
      flex:1 1 auto;
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:0 8px;
    }

    .portrait-now{
      width:100%;
      max-width:320px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
    }

    .track-title{
      width:100%;
      font-size:clamp(38px, 11vw, 58px);
      line-height:.95;
      font-weight:600;
      letter-spacing:-.07em;
      color:#fff;
      word-break:break-word;
      text-wrap:balance;
      min-height:1.9em;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      transition:opacity .2s ease, transform .2s ease;
    }

    .track-sub{
      min-height:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      color:rgba(255,255,255,.34);
      font-size:15px;
      font-weight:500;
      letter-spacing:-.01em;
    }

    .dot-sep{
      width:4px;
      height:4px;
      border-radius:50%;
      background:rgba(255,255,255,.18);
      flex:0 0 4px;
    }

    .portrait-micro{
      height:42px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .swipe-hint{
      display:flex;
      align-items:center;
      gap:10px;
      color:rgba(255,255,255,.22);
      font-size:13px;
      font-weight:500;
      padding:8px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.02);
      border:1px solid rgba(255,255,255,.04);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
    }

    .swipe-arrow{
      color:rgba(255,255,255,.30);
      font-size:14px;
      line-height:1;
    }

    .portrait-bottom{
      flex:0 0 auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
    }

    .portrait-controls{
      width:100%;
      max-width:320px;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:12px;
    }

    .portrait .nav-btn{
      width:52px;
      height:52px;
      border-radius:50%;
      justify-self:center;
    }

    .portrait .play-btn{
      width:102px;
      height:102px;
      border-radius:50%;
    }

    .portrait-actions{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .portrait .action-btn{
      padding:10px 14px;
      font-size:14px;
      font-weight:500;
    }

    /* ---------- landscape drive ---------- */

    .drive{
      position:relative;
      z-index:4;
      width:100%;
      height:100%;
      display:none;
      grid-template-columns:220px 1fr 190px;
      grid-template-rows:56px 1fr 150px;
      gap:16px 18px;
      align-items:stretch;
    }

    .drive-top{
      grid-column:1 / span 3;
      display:flex;
      align-items:flex-start;
      justify-content:flex-start;
      padding-top:4px;
    }

    .drive-left{
      grid-column:1;
      grid-row:2 / span 2;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:14px;
    }

    .drive-genres{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .drive .genre{
      width:100%;
      min-height:68px;
      padding:0 22px;
      border-radius:24px;
      text-align:left;
      font-size:22px;
      font-weight:600;
      letter-spacing:.08em;
      background:rgba(255,255,255,.02);
      border-color:rgba(255,255,255,.08);
    }

    .drive .genre.active{
      background:linear-gradient(to right, rgba(var(--theme-a),.10), rgba(255,255,255,.05));
      border-color:rgba(var(--theme-c),.22);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 0 22px rgba(var(--theme-a),.08);
    }

    .drive-center{
      grid-column:2;
      grid-row:2;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
    }

    .drive-now{
      width:100%;
      max-width:none;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:16px;
    }

    .drive-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:8px 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.025);
      color:rgba(255,255,255,.40);
      font-size:12px;
      font-weight:600;
      letter-spacing:.18em;
      text-transform:uppercase;
    }

    .drive .track-title{
      font-size:clamp(52px, 6vw, 86px);
      min-height:1.2em;
      letter-spacing:-.065em;
    }

    .drive .track-sub{
      font-size:20px;
      color:rgba(255,255,255,.42);
    }

    .drive-micro{
      height:60px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .drive-micro .micro-dot{
      width:8px;
      height:8px;
    }

    .drive-bottom{
      grid-column:2;
      grid-row:3;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-end;
      gap:16px;
    }

    .drive-controls{
      width:100%;
      max-width:540px;
      display:grid;
      grid-template-columns:88px 1fr 88px;
      gap:18px;
      align-items:center;
    }

    .drive .nav-btn{
      width:78px;
      height:78px;
      border-radius:22px;
      background:rgba(255,255,255,.02);
      border:1px solid rgba(255,255,255,.05);
      justify-self:center;
    }

    .drive .nav-btn svg{
      width:34px;
      height:34px;
    }

    .drive .play-btn{
      width:136px;
      height:136px;
      border-radius:36px;
      justify-self:center;
    }

    .drive .play-btn svg{
      width:44px;
      height:44px;
    }

    .drive-actions{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
    }

    .drive .action-btn{
      min-height:48px;
      padding:0 18px;
      font-size:15px;
      font-weight:500;
    }

    .drive-right{
      grid-column:3;
      grid-row:2 / span 2;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      gap:16px;
    }

    .theme-panel,
    .drive-card{
      padding:16px;
      border-radius:24px;
      border:1px solid rgba(255,255,255,.07);
      background:rgba(255,255,255,.03);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }

    .theme-panel-title,
    .drive-card-title{
      color:rgba(255,255,255,.38);
      font-size:12px;
      font-weight:600;
      letter-spacing:.16em;
      text-transform:uppercase;
      margin-bottom:12px;
    }

    .theme-row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .theme-chip{
      border:none;
      width:28px;
      height:28px;
      border-radius:50%;
      cursor:pointer;
      border:1px solid rgba(255,255,255,.16);
      box-shadow:0 0 0 1px rgba(255,255,255,.03);
      padding:0;
      transition:transform .15s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .theme-chip:active{ transform:scale(.94); }

    .theme-chip.active{
      border-color:#fff;
      box-shadow:0 0 0 1px rgba(255,255,255,.10), 0 0 14px rgba(255,255,255,.10);
    }

    .theme-chip[data-theme="audi"]{
      background:linear-gradient(135deg, rgb(88,180,255), rgb(215,235,255));
    }
    .theme-chip[data-theme="porsche"]{
      background:linear-gradient(135deg, rgb(255,171,120), rgb(255,108,76));
    }
    .theme-chip[data-theme="bmw"]{
      background:linear-gradient(135deg, rgb(138,162,255), rgb(220,235,255));
    }
    .theme-chip[data-theme="stealth"]{
      background:linear-gradient(135deg, rgb(90,90,90), rgb(220,220,220));
    }

    .drive-card-value{
      color:#fff;
      font-size:28px;
      font-weight:600;
      letter-spacing:-.04em;
      margin-bottom:6px;
    }

    .drive-card-meta{
      color:rgba(255,255,255,.34);
      font-size:14px;
      font-weight:500;
    }

    /* ---------- sheet ---------- */

    .sheet-backdrop{
      position:fixed;
      inset:0;
      z-index:20;
      background:rgba(0,0,0,.42);
      opacity:0;
      pointer-events:none;
      transition:opacity .24s ease;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }

    .sheet-backdrop.open{
      opacity:1;
      pointer-events:auto;
    }

    .sheet{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:21;
      transform:translateY(104%);
      transition:transform .3s cubic-bezier(.2,.8,.2,1);
      padding:0 10px calc(env(safe-area-inset-bottom) + 10px);
      pointer-events:none;
    }

    .sheet.open{
      transform:translateY(0);
      pointer-events:auto;
    }

    .sheet-card{
      width:100%;
      max-width:430px;
      margin:0 auto;
      border-radius:30px 30px 22px 22px;
      background:linear-gradient(to bottom, rgba(22,22,22,.97), rgba(8,8,8,.98));
      border:1px solid rgba(255,255,255,.07);
      box-shadow:0 28px 80px rgba(0,0,0,.58);
      overflow:hidden;
    }

    .sheet-head{
      padding:12px 18px 10px;
      border-bottom:1px solid rgba(255,255,255,.06);
    }

    .sheet-handle{
      width:42px;
      height:5px;
      border-radius:999px;
      background:rgba(255,255,255,.14);
      margin:0 auto 12px;
    }

    .sheet-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      min-height:24px;
    }

    .sheet-title strong{
      font-size:15px;
      font-weight:600;
      letter-spacing:-.01em;
      color:#fff;
    }

    .sheet-title span{
      font-size:13px;
      color:rgba(255,255,255,.36);
    }

    .track-list{
      max-height:min(52vh, 430px);
      overflow:auto;
      padding:8px 10px 10px;
      scrollbar-width:none;
      -ms-overflow-style:none;
    }

    .track-list::-webkit-scrollbar{ display:none; }

    .track-item{
      width:100%;
      border:none;
      background:transparent;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      text-align:left;
      padding:14px 12px;
      border-radius:16px;
      cursor:pointer;
      transition:background .18s ease, transform .14s ease;
    }

    .track-item:hover{ background:rgba(255,255,255,.04); }
    .track-item:active{ transform:scale(.995); }

    .track-item.active{
      background:rgba(255,255,255,.055);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
    }

    .track-item-main{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
      flex:1;
    }

    .track-index{
      width:24px;
      flex:0 0 24px;
      font-size:13px;
      font-weight:600;
      color:rgba(255,255,255,.26);
    }

    .track-name{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:15px;
      font-weight:500;
      letter-spacing:-.01em;
    }

    .track-item-meta{
      flex:0 0 auto;
      display:flex;
      align-items:center;
      gap:8px;
      color:rgba(255,255,255,.28);
      font-size:12px;
    }

    .playing-pill{
      width:8px;
      height:8px;
      border-radius:50%;
      background:rgba(255,255,255,.85);
      box-shadow:0 0 10px rgba(var(--theme-c),.24);
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:calc(env(safe-area-inset-bottom) + 116px);
      transform:translateX(-50%) translateY(10px);
      z-index:40;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.07);
      background:rgba(255,255,255,.08);
      color:#fff;
      font-size:13px;
      font-weight:500;
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      opacity:0;
      pointer-events:none;
      transition:opacity .22s ease, transform .22s ease;
      white-space:nowrap;
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    @media (orientation: landscape){
      .shell{
        max-width:100%;
        padding:
          calc(var(--safe-top) + 8px)
          26px
          calc(var(--safe-bottom) + 12px);
      }

      .portrait{ display:none; }
      .drive{ display:grid; }
      .sheet-card{ max-width:920px; }
    }

    @media (min-width:431px){
      .shell{
        box-shadow:0 0 70px rgba(0,0,0,.34);
      }
    }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>

  <div class="app">
    <div class="shell">
      <div class="gesture-layer" id="gestureLayer"></div>

      <!-- PORTRAIT -->
      <div class="portrait" id="portraitLayout">
        <div class="portrait-top">
          <div class="logo" id="logoPortrait">RESONANCE</div>
        </div>

        <div class="portrait-genres-wrap">
          <div class="portrait-genres" id="portraitGenres"></div>
        </div>

        <div class="portrait-center">
          <div class="portrait-now">
            <div class="track-title" id="trackTitlePortrait">lofi 1</div>

            <div class="track-sub">
              <span id="trackCounterPortrait">1 / 1</span>
              <span class="dot-sep"></span>
              <span id="trackTimePortrait">00:00</span>
            </div>

            <div class="portrait-micro">
              <div class="micro-dots">
                <span class="micro-dot micro-p"></span>
                <span class="micro-dot micro-p"></span>
                <span class="micro-dot micro-p"></span>
              </div>
            </div>

            <div class="swipe-hint">
              <span class="swipe-arrow">←</span>
              <span>свайп по экрану</span>
              <span class="swipe-arrow">→</span>
            </div>
          </div>
        </div>

        <div class="portrait-bottom">
          <div class="portrait-controls">
            <button class="nav-btn" id="prevBtnPortrait" aria-label="Предыдущий трек">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                <path d="M15.5 18L9.5 12L15.5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>

            <button class="play-btn" id="playBtnPortrait" aria-label="Воспроизвести или пауза">
              <svg class="play-icon" width="34" height="34" viewBox="0 0 24 24" fill="none"></svg>
            </button>

            <button class="nav-btn" id="nextBtnPortrait" aria-label="Следующий трек">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                <path d="M8.5 18L14.5 12L8.5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>

          <div class="portrait-actions">
            <button class="action-btn" id="offlineBtnPortrait">Скачать офлайн</button>
            <button class="action-btn" id="queueBtnPortrait">Список треков</button>

        </div>
      </div>

      <!-- LANDSCAPE DRIVE -->
      <div class="drive" id="driveLayout">
        <div class="drive-top">
          <div class="logo" id="logoDrive">RESONANCE</div>

        <div class="drive-left">
          <div class="drive-genres" id="driveGenres"></div>
        </div>

        <div class="drive-center">
          <div class="drive-now">
            <div class="drive-badge">Drive Mode</div>

            <div class="track-title" id="trackTitleDrive">lofi 1</div>

            <div class="track-sub">
              <span id="trackCounterDrive">1 / 1</span>
              <span class="dot-sep"></span>
              <span id="trackTimeDrive">00:00</span>
            </div>

            <div class="drive-micro">
              <div class="micro-dots">
                <span class="micro-dot micro-d"></span>
                <span class="micro-dot micro-d"></span>
                <span class="micro-dot micro-d"></span>
              </div>
            </div>
          </div>
        </div>

        <div class="drive-bottom">
          <div class="drive-controls">
            <button class="nav-btn" id="prevBtnDrive" aria-label="Предыдущий трек">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
                <path d="M15.5 18L9.5 12L15.5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>

            <button class="play-btn" id="playBtnDrive" aria-label="Воспроизвести или пауза">
              <svg class="play-icon" width="44" height="44" viewBox="0 0 24 24" fill="none"></svg>
            </button>

            <button class="nav-btn" id="nextBtnDrive" aria-label="Следующий трек">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
                <path d="M8.5 18L14.5 12L8.5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>

          <div class="drive-actions">
            <button class="action-btn" id="offlineBtnDrive">Скачать офлайн</button>
            <button class="action-btn" id="queueBtnDrive">Список треков</button>
          </div>
        </div>

        <div class="drive-right">
          <div class="theme-panel">
            <div class="theme-panel-title">Interior Theme</div>
            <div class="theme-row">
              <button class="theme-chip active" data-theme="audi" aria-label="Audi Blue"></button>
              <button class="theme-chip" data-theme="porsche" aria-label="Porsche Amber"></button>
              <button class="theme-chip" data-theme="bmw" aria-label="BMW Ice"></button>
              <button class="theme-chip" data-theme="stealth" aria-label="Stealth"></button>
            </div>
          </div>

          <div class="drive-card">
            <div class="drive-card-title">Genre</div>
            <div class="drive-card-value" id="driveGenreLabel">Lo-Fi</div>
            <div class="drive-card-meta" id="driveOfflineStatus">Онлайн</div>
          </div>

          <div class="drive-card">
            <div class="drive-card-title">Gesture</div>
            <div class="drive-card-value">← →</div>
            <div class="drive-card-meta">Свайп по экрану • двойной тап — play</div>
          </div>

      </div>
    </div>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>

  <div class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-card">
      <div class="sheet-head">
        <div class="sheet-handle"></div>
        <div class="sheet-title">
          <strong id="sheetTitle">Треки</strong>
          <span id="sheetMeta">0</span>
        </div>
      </div>
      <div class="track-list" id="trackList"></div>
    </div>
  </div>

  <div class="toast" id="toast">Готово</div>

  <audio id="audio" preload="metadata" playsinline webkit-playsinline></audio>

  <script>
    const APP_NAME = "RESONANCE";
    const TRACK_CACHE = "resonance-track-cache-v1";
    const MANIFEST_KEY = "resonance-local-manifest-v1";
    const THEME_KEY = "resonance-drive-theme-v1";

    const GENRES = [
      { id: "lofi", name: "Lo-Fi", prefix: "lofi", maxFiles: 100 },
      { id: "rap",  name: "Rap",   prefix: "rap",  maxFiles: 100 },
      { id: "jazz", name: "Jazz",  prefix: "jazz", maxFiles: 100 }
    ];

    const THEMES = {
      audi:    { a: "110,200,255", b: "255,150,120", c: "185,232,255" },
      porsche: { a: "255,181,120", b: "255,105,74",  c: "255,220,180" },
      bmw:     { a: "128,160,255", b: "120,215,255", c: "215,235,255" },
      stealth: { a: "205,205,205", b: "118,118,118", c: "245,245,245" }
    };

    const audio = document.getElementById("audio");
    const gestureLayer = document.getElementById("gestureLayer");
    const sheet = document.getElementById("sheet");
    const sheetBackdrop = document.getElementById("sheetBackdrop");
    const sheetTitle = document.getElementById("sheetTitle");
    const sheetMeta = document.getElementById("sheetMeta");
    const trackListEl = document.getElementById("trackList");
    const toastEl = document.getElementById("toast");
    const canvas = document.getElementById("bgCanvas");
    const ctx = canvas.getContext("2d", { alpha: true });

    const ui = {
      portraitGenres: document.getElementById("portraitGenres"),
      driveGenres: document.getElementById("driveGenres"),
      trackTitlePortrait: document.getElementById("trackTitlePortrait"),
      trackCounterPortrait: document.getElementById("trackCounterPortrait"),
      trackTimePortrait: document.getElementById("trackTimePortrait"),
      trackTitleDrive: document.getElementById("trackTitleDrive"),
      trackCounterDrive: document.getElementById("trackCounterDrive"),
      trackTimeDrive: document.getElementById("trackTimeDrive"),
      driveGenreLabel: document.getElementById("driveGenreLabel"),
      driveOfflineStatus: document.getElementById("driveOfflineStatus"),
      logoPortrait: document.getElementById("logoPortrait"),
      logoDrive: document.getElementById("logoDrive"),
      playBtns: [
        document.getElementById("playBtnPortrait"),
        document.getElementById("playBtnDrive")
      ],
      prevBtns: [
        document.getElementById("prevBtnPortrait"),
        document.getElementById("prevBtnDrive")
      ],
      nextBtns: [
        document.getElementById("nextBtnPortrait"),
        document.getElementById("nextBtnDrive")
      ],
      queueBtns: [
        document.getElementById("queueBtnPortrait"),
        document.getElementById("queueBtnDrive")
      ],
      offlineBtns: [
        document.getElementById("offlineBtnPortrait"),
        document.getElementById("offlineBtnDrive")
      ],
      microDots: [
        ...document.querySelectorAll(".micro-p"),
        ...document.querySelectorAll(".micro-d")
      ],
      playIcons: [...document.querySelectorAll(".play-icon")]
    };

    let currentGenre = GENRES[0];
    let currentTrackList = [];
    let currentLocalIndex = 0;
    let currentTrackTitle = "lofi 1";
    let sheetOpen = false;
    let toastTimer = null;
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;
    let lastTap = 0;
    let fakeEnergy = 0.06;
    let bgPulse = 0;
    let cachedManifest = loadManifest();
    let currentObjectUrl = null;
    let currentTheme = localStorage.getItem(THEME_KEY) || "audi";

    const localTrackCache = {};
    const particles = Array.from({ length: 34 }, () => ({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 1.8 + 0.5,
      a: Math.random() * .12 + .03,
      drift: Math.random() * .18 + .05
    }));

    function loadManifest(){
      try{
        return JSON.parse(localStorage.getItem(MANIFEST_KEY) || "{}");
      }catch(e){
        return {};
      }
    }

    function saveManifest(){
      localStorage.setItem(MANIFEST_KEY, JSON.stringify(cachedManifest));
    }

    function createManifest(){
      const iconSVG = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <rect width="512" height="512" rx="120" fill="#000"/>
          <text x="256" y="282" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="54" letter-spacing="12">R</text>
        </svg>
      `;
      const iconURL = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(iconSVG);
      const manifest = {
        name: APP_NAME,
        short_name: APP_NAME,
        start_url: "./",
        display: "standalone",
        background_color: "#000000",
        theme_color: "#000000",
        icons: [
          { src: iconURL, sizes: "192x192", type: "image/svg+xml", purpose: "any" },
          { src: iconURL, sizes: "512x512", type: "image/svg+xml", purpose: "any" }
        ]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("link");
      link.rel = "manifest";
      link.href = url;
      document.head.appendChild(link);
    }

    async function registerSW(){
      if (!("serviceWorker" in navigator)) return;
      if (location.protocol === "file:") return;
      try{
        await navigator.serviceWorker.register("./sw.js");
      }catch(e){}
    }

    function applyTheme(name){
      const theme = THEMES[name] || THEMES.audi;
      currentTheme = name;
      localStorage.setItem(THEME_KEY, name);

      document.documentElement.style.setProperty("--theme-a", theme.a);
      document.documentElement.style.setProperty("--theme-b", theme.b);
      document.documentElement.style.setProperty("--theme-c", theme.c);

      document.querySelectorAll(".theme-chip").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.theme === name);
      });
    }

    function initThemes(){
      document.querySelectorAll(".theme-chip").forEach(btn => {
        btn.addEventListener("click", () => applyTheme(btn.dataset.theme));
      });
      applyTheme(currentTheme);
    }

    function setPlayIcon(paused){
      const html = paused
        ? '<path d="M9 6.7v10.6c0 .7.8 1.14 1.4.78l7.9-5.3a.93.93 0 0 0 0-1.56l-7.9-5.3A.93.93 0 0 0 9 6.7Z" fill="currentColor"/>'
        : '<path d="M8 6.5v11M16 6.5v11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';

      ui.playIcons.forEach(el => el.innerHTML = html);
      ui.playBtns.forEach(el => el.classList.toggle("playing", !paused));
      ui.logoPortrait.classList.toggle("playing", !paused);
      ui.logoDrive.classList.toggle("playing", !paused);
    }

    function showToast(text){
      clearTimeout(toastTimer);
      toastEl.textContent = text;
      toastEl.classList.add("show");
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1500);
    }

    function openSheet(){
      sheetOpen = true;
      sheet.classList.add("open");
      sheetBackdrop.classList.add("open");
      sheet.setAttribute("aria-hidden", "false");
      renderTrackList();
    }

    function closeSheet(){
      sheetOpen = false;
      sheet.classList.remove("open");
      sheetBackdrop.classList.remove("open");
      sheet.setAttribute("aria-hidden", "true");
    }

    function escapeHtml(text){
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function stripExtension(name){
      return name.replace(/\.[^/.]+$/, "");
    }

    function buildTrackTitle(genre, index, url){
      try{
        const fileName = decodeURIComponent(url.split("/").pop() || "");
        const clean = stripExtension(fileName);
        if (clean) return clean.replace(/[-_]+/g, " ");
      }catch(e){}
      return `${genre.name} ${index + 1}`;
    }

    function renderGenres(){
      ui.portraitGenres.innerHTML = "";
      ui.driveGenres.innerHTML = "";

      GENRES.forEach((genre) => {
        const makeBtn = () => {
          const button = document.createElement("button");
          button.className = "genre";
          button.textContent = genre.name;
          if (genre.id === currentGenre.id) button.classList.add("active");
          button.addEventListener("click", async () => {
            await selectGenre(genre, true);
          });
          return button;
        };

        ui.portraitGenres.appendChild(makeBtn());
        ui.driveGenres.appendChild(makeBtn());
      });
    }

    function updateNowPlayingUI(){
      const setTitle = (el) => {
        el.style.opacity = ".72";
        el.style.transform = "translateY(2px)";
        requestAnimationFrame(() => {
          el.textContent = currentTrackTitle;
          el.style.opacity = "1";
          el.style.transform = "translateY(0)";
        });
      };

      setTitle(ui.trackTitlePortrait);
      setTitle(ui.trackTitleDrive);

      const counter = currentTrackList.length
        ? `${currentLocalIndex + 1} / ${currentTrackList.length}`
        : "—";

      ui.trackCounterPortrait.textContent = counter;
      ui.trackCounterDrive.textContent = counter;
      ui.driveGenreLabel.textContent = currentGenre.name;

      sheetTitle.textContent = currentGenre.name;
      sheetMeta.textContent = `${currentTrackList.length} треков`;
    }

    function updateTime(){
      const text = formatTime(audio.currentTime || 0);
      ui.trackTimePortrait.textContent = text;
      ui.trackTimeDrive.textContent = text;
    }

    function renderTrackList(){
      trackListEl.innerHTML = "";

      currentTrackList.forEach((url, index) => {
        const item = document.createElement("button");
        item.className = "track-item";
        if (index === currentLocalIndex) item.classList.add("active");

        const visibleName = buildTrackTitle(currentGenre, index, url);

        item.innerHTML = `
          <span class="track-item-main">
            <span class="track-index">${String(index + 1).padStart(2, "0")}</span>
            <span class="track-name">${escapeHtml(visibleName)}</span>
          </span>
          <span class="track-item-meta">
            ${index === currentLocalIndex ? '<span class="playing-pill"></span>' : ''}
          </span>
        `;

        item.addEventListener("click", async () => {
          currentLocalIndex = index;
          await loadCurrentLocalTrack(true);
          closeSheet();
        });

        trackListEl.appendChild(item);
      });
    }

    async function fileExists(url){
      if (!navigator.onLine) return false;

      try{
        const head = await fetch(url, { method: "HEAD", cache: "no-store" });
        if (head.ok) return true;
      }catch(e){}

      try{
        const range = await fetch(url, {
          method: "GET",
          headers: { Range: "bytes=0-0" },
          cache: "no-store"
        });
        return range.ok || range.status === 206;
      }catch(e){
        return false;
      }
    }

    async function getLocalTracksForGenre(genre){
      if (localTrackCache[genre.id]) return localTrackCache[genre.id];

      if (cachedManifest[genre.id]?.length){
        localTrackCache[genre.id] = cachedManifest[genre.id];
      }

      if (!navigator.onLine && localTrackCache[genre.id]?.length){
        return localTrackCache[genre.id];
      }

      const tracks = [];

      for (let i = 1; i <= genre.maxFiles; i++){
        const url = `./${genre.prefix}-${i}.mp3`;
        const exists = await fileExists(url);

        if (exists) tracks.push(url);
        else break;
      }

      if (tracks.length){
        localTrackCache[genre.id] = tracks;
        cachedManifest[genre.id] = tracks;
        saveManifest();
      }

      return localTrackCache[genre.id] || tracks;
    }

    async function getCache(){
      if (!("caches" in window)) return null;
      try{
        return await caches.open(TRACK_CACHE);
      }catch(e){
        return null;
      }
    }

    async function isGenreCachedOffline(genre){
      const urls = cachedManifest[genre.id] || localTrackCache[genre.id] || [];
      if (!urls.length) return false;

      const cache = await getCache();
      if (!cache) return false;

      for (const url of urls){
        const match = await cache.match(url);
        if (!match) return false;
      }
      return true;
    }

    async function updateOfflineButtons(){
      const ready = await isGenreCachedOffline(currentGenre);
      ui.offlineBtns.forEach(btn => {
        btn.classList.toggle("ready", ready);
        btn.textContent = ready ? "Офлайн готов" : "Скачать офлайн";
      });
      ui.driveOfflineStatus.textContent = ready ? "Офлайн готов" : "Онлайн";
    }

    async function cacheGenreOffline(genre){
      const urls = await getLocalTracksForGenre(genre);
      if (!urls.length){
        showToast("Нет треков для сохранения");
        return;
      }

      const cache = await getCache();
      if (!cache){
        showToast("Офлайн недоступен");
        return;
      }

      ui.offlineBtns.forEach(btn => {
        btn.textContent = "Скачивание…";
        btn.disabled = true;
      });

      try{
        for (const url of urls){
          const existing = await cache.match(url);
          if (existing) continue;

          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) throw new Error("download failed");
          await cache.put(url, res.clone());
        }

        await updateOfflineButtons();
        showToast("Жанр сохранён офлайн");
      }catch(e){
        showToast("Не удалось скачать");
      }finally{
        ui.offlineBtns.forEach(btn => btn.disabled = false);
      }
    }

    async function resolvePlayableSrc(url){
      if (currentObjectUrl){
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }

      if (navigator.onLine) return url;

      const cache = await getCache();
      if (!cache) return url;

      const match = await cache.match(url);
      if (!match) return url;

      const blob = await match.blob();
      currentObjectUrl = URL.createObjectURL(blob);
      return currentObjectUrl;
    }

    async function selectGenre(genre, autoplay = true){
      currentGenre = genre;
      renderGenres();
      closeSheet();

      currentTrackList = await getLocalTracksForGenre(genre);

      if (!currentTrackList.length){
        currentTrackTitle = genre.name;
        updateNowPlayingUI();
        ui.trackTimePortrait.textContent = navigator.onLine ? "Нет файлов" : "Нет офлайна";
        ui.trackTimeDrive.textContent = navigator.onLine ? "Нет файлов" : "Нет офлайна";
        audio.pause();
        audio.removeAttribute("src");
        audio.load();
        setPlayIcon(true);
        renderTrackList();
        await updateOfflineButtons();
        showToast(navigator.onLine ? "Файлы не найдены" : "Сначала скачай жанр");
        return;
      }

      currentLocalIndex = 0;
      await loadCurrentLocalTrack(autoplay);
      await updateOfflineButtons();
    }

    async function loadCurrentLocalTrack(autoplay = true){
      if (!currentTrackList.length) return;

      const url = currentTrackList[currentLocalIndex];
      const resolvedSrc = await resolvePlayableSrc(url);

      audio.src = resolvedSrc;
      currentTrackTitle = buildTrackTitle(currentGenre, currentLocalIndex, url);
      audio.load();

      updateNowPlayingUI();
      renderTrackList();

      if (autoplay) await safePlay();
      updateMediaSession();
    }

    async function nextTrack(){
      if (!currentTrackList.length) return;
      currentLocalIndex = (currentLocalIndex + 1) % currentTrackList.length;
      await loadCurrentLocalTrack(true);
    }

    async function prevTrack(){
      if (!currentTrackList.length) return;
      currentLocalIndex = (currentLocalIndex - 1 + currentTrackList.length) % currentTrackList.length;
      await loadCurrentLocalTrack(true);
    }

    async function ensurePlaybackHints(){
      try{
        if ("audioSession" in navigator && navigator.audioSession){
          navigator.audioSession.type = "playback";
        }
      }catch(e){}
    }

    async function safePlay(){
      try{
        await ensurePlaybackHints();
        await audio.play();
      }catch(e){
        if (!navigator.onLine){
          showToast("Трек не сохранён офлайн");
        }
      }
    }

    function formatTime(seconds){
      if (!Number.isFinite(seconds) || seconds < 0) return "00:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function createArtworkDataURL(text){
      const safe = String(text || APP_NAME).slice(0, 24);
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <rect width="512" height="512" rx="96" fill="#000"/>
          <text x="256" y="270" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="42" letter-spacing="10">${safe}</text>
        </svg>
      `);
    }

    function updateMediaSession(){
      if (!("mediaSession" in navigator)) return;

      navigator.mediaSession.metadata = new MediaMetadata({
        title: currentTrackTitle || currentGenre?.name || APP_NAME,
        artist: currentGenre?.name || APP_NAME,
        album: APP_NAME,
        artwork: [{
          src: createArtworkDataURL(currentGenre?.name || APP_NAME),
          sizes: "512x512",
          type: "image/svg+xml"
        }]
      });

      navigator.mediaSession.setActionHandler("play", async () => { await safePlay(); });
      navigator.mediaSession.setActionHandler("pause", () => audio.pause());

      try{
        navigator.mediaSession.setActionHandler("nexttrack", async () => { await nextTrack(); });
      }catch(e){}

      try{
        navigator.mediaSession.setActionHandler("previoustrack", async () => { await prevTrack(); });
      }catch(e){}

      updateMediaSessionPlayback();
    }

    function updateMediaSessionPlayback(){
      if ("mediaSession" in navigator) {
        navigator.mediaSession.playbackState = audio.paused ? "paused" : "playing";
      }
    }

    function tapButton(btn){
      btn.classList.add("tap");
      btn.blur();
      setTimeout(() => btn.classList.remove("tap"), 140);
    }

    function bindControls(){
      ui.playBtns.forEach(btn => btn.addEventListener("click", togglePlayback));

      ui.prevBtns.forEach(btn => btn.addEventListener("click", async () => {
        tapButton(btn);
        await prevTrack();
      }));

      ui.nextBtns.forEach(btn => btn.addEventListener("click", async () => {
        tapButton(btn);
        await nextTrack();
      }));

      ui.offlineBtns.forEach(btn => btn.addEventListener("click", async () => {
        await cacheGenreOffline(currentGenre);
      }));

      ui.queueBtns.forEach(btn => btn.addEventListener("click", () => {
        if (sheetOpen) closeSheet();
        else openSheet();
      }));

      sheetBackdrop.addEventListener("click", closeSheet);
    }

    async function togglePlayback(){
      if (!audio.src){
        await selectGenre(currentGenre || GENRES[0], true);
        return;
      }

      if (audio.paused) await safePlay();
      else audio.pause();
    }

    audio.addEventListener("play", () => {
      setPlayIcon(false);
      updateMediaSessionPlayback();
    });

    audio.addEventListener("pause", () => {
      setPlayIcon(true);
      updateMediaSessionPlayback();
    });

    audio.addEventListener("ended", async () => {
      await nextTrack();
    });

    audio.addEventListener("error", async () => {
      if (!navigator.onLine){
        showToast("Трек не сохранён офлайн");
        return;
      }
      await nextTrack();
    });

    audio.addEventListener("loadedmetadata", updateTime);
    audio.addEventListener("timeupdate", updateTime);

    function resizeCanvas(){
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(innerWidth * dpr);
      canvas.height = Math.floor(innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function getEnergy(){
      const t = performance.now() * 0.001;
      const boost = !audio.paused && audio.src ? .14 : 0;
      fakeEnergy += (((0.025 + Math.sin(t * 1.5) * 0.012) + boost) - fakeEnergy) * 0.05;
      return Math.max(0.025, fakeEnergy);
    }

    function updateQuietPulse(time){
      const t = time * 0.001;
      const e = getEnergy();

      if (audio.paused || !audio.src){
        ui.microDots.forEach((d) => {
          d.classList.remove("live");
          d.style.transform = "scale(1)";
          d.style.opacity = ".42";
        });
        return;
      }

      const values = [
        0.92 + Math.sin(t * 2.4) * 0.10 + e * 0.12,
        1.06 + Math.sin(t * 2.4 + 0.7) * 0.12 + e * 0.16,
        0.92 + Math.sin(t * 2.4 + 1.4) * 0.10 + e * 0.12
      ];

      ui.microDots.forEach((d, i) => {
        d.classList.add("live");
        d.style.transform = `scale(${values[i % 3]})`;
        d.style.opacity = String((i % 3 === 1 ? 0.52 : 0.42) + e * (i % 3 === 1 ? 0.9 : 0.8));
      });
    }

    function drawBackground(time){
      const t = time * 0.001;
      const w = innerWidth;
      const h = innerHeight;
      const e = getEnergy();

      ctx.clearRect(0, 0, w, h);
      bgPulse += ((0.18 + e * 0.9) - bgPulse) * 0.05;

      const themeA = getComputedStyle(document.documentElement).getPropertyValue("--theme-a").trim();
      const themeB = getComputedStyle(document.documentElement).getPropertyValue("--theme-b").trim();
      const themeC = getComputedStyle(document.documentElement).getPropertyValue("--theme-c").trim();
      const isLandscape = window.matchMedia("(orientation: landscape)").matches;

      const sphere1 = ctx.createRadialGradient(
        w * (isLandscape ? 0.44 : 0.30),
        h * (isLandscape ? 0.30 : 0.30),
        0,
        w * (isLandscape ? 0.44 : 0.30),
        h * (isLandscape ? 0.30 : 0.30),
        Math.min(w, h) * (isLandscape ? 0.52 : 0.40)
      );
      sphere1.addColorStop(0, `rgba(${themeA},${0.14 + bgPulse * 0.18})`);
      sphere1.addColorStop(0.35, `rgba(${themeA},${0.05 + bgPulse * 0.07})`);
      sphere1.addColorStop(1, `rgba(${themeA},0)`);
      ctx.fillStyle = sphere1;
      ctx.fillRect(0, 0, w, h);

      const sphere2 = ctx.createRadialGradient(
        w * (isLandscape ? 0.76 : 0.77),
        h * (isLandscape ? 0.66 : 0.68),
        0,
        w * (isLandscape ? 0.76 : 0.77),
        h * (isLandscape ? 0.66 : 0.68),
        Math.min(w, h) * (isLandscape ? 0.56 : 0.44)
      );
      sphere2.addColorStop(0, `rgba(${themeB},${0.12 + bgPulse * 0.16})`);
      sphere2.addColorStop(0.34, `rgba(${themeB},${0.04 + bgPulse * 0.06})`);
      sphere2.addColorStop(1, `rgba(${themeB},0)`);
      ctx.fillStyle = sphere2;
      ctx.fillRect(0, 0, w, h);

      const sphere3 = ctx.createRadialGradient(
        w * (isLandscape ? 0.58 : 0.58),
        h * (isLandscape ? 0.46 : 0.52),
        0,
        w * (isLandscape ? 0.58 : 0.58),
        h * (isLandscape ? 0.46 : 0.52),
        Math.min(w, h) * (isLandscape ? 0.30 : 0.24)
      );
      sphere3.addColorStop(0, `rgba(${themeC},${0.08 + e * 0.12})`);
      sphere3.addColorStop(0.4, `rgba(${themeC},${0.02 + e * 0.05})`);
      sphere3.addColorStop(1, `rgba(${themeC},0)`);
      ctx.fillStyle = sphere3;
      ctx.fillRect(0, 0, w, h);

      const lineY = h * .52;
      const line = ctx.createLinearGradient(w * .18, lineY, w * .82, lineY);
      line.addColorStop(0, `rgba(${themeA},0)`);
      line.addColorStop(.5, `rgba(255,255,255,${0.05 + e * 0.09})`);
      line.addColorStop(1, `rgba(${themeB},0)`);
      ctx.fillStyle = line;
      ctx.fillRect(w * .18, lineY - .5, w * .64, 1);

      if (isLandscape){
        const lane = ctx.createLinearGradient(w * 0.46, 0, w * 0.74, 0);
        lane.addColorStop(0, `rgba(${themeA},0)`);
        lane.addColorStop(.55, `rgba(${themeA},${0.07 + e * 0.10})`);
        lane.addColorStop(1, `rgba(${themeB},0)`);
        ctx.fillStyle = lane;
        ctx.fillRect(w * 0.40, h * 0.14, w * 0.30, h * 0.72);
      }

      for (const p of particles){
        const x = p.x * w + Math.sin(t * p.drift + p.y * 8) * 8;
        const y = p.y * h + Math.cos(t * p.drift + p.x * 7) * 8;
        ctx.beginPath();
        ctx.arc(x, y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${p.a * (0.9 + bgPulse * 1.1)})`;
        ctx.fill();
      }

      updateQuietPulse(time);
      requestAnimationFrame(drawBackground);
    }

    function setupGestures(){
      gestureLayer.addEventListener("touchstart", (e) => {
        const t = e.touches[0];
        touchStartX = t.clientX;
        touchStartY = t.clientY;
        touchStartTime = Date.now();

        const now = Date.now();
        if (now - lastTap < 260){
          togglePlayback();
        }
        lastTap = now;
      }, { passive:true });

      gestureLayer.addEventListener("touchend", async (e) => {
        const t = e.changedTouches[0];
        const dx = t.clientX - touchStartX;
        const dy = t.clientY - touchStartY;
        const dt = Date.now() - touchStartTime;

        if (dt > 700) return;

        const absX = Math.abs(dx);
        const absY = Math.abs(dy);

        if (absX < 20 && absY < 20) return;

        if (absX > absY && absX > 48){
          if (dx < 0) await nextTrack();
          else await prevTrack();
          return;
        }

        if (absY > absX && absY > 58){
          if (dy < 0) openSheet();
          else closeSheet();
        }
      }, { passive:true });

      window.addEventListener("keydown", async (e) => {
        if (e.key === "ArrowRight") await nextTrack();
        if (e.key === "ArrowLeft") await prevTrack();
        if (e.key === " "){
          e.preventDefault();
          await togglePlayback();
        }
        if (e.key === "Escape") closeSheet();
      });
    }

    function initWarmup(){
      ["touchstart", "click"].forEach((evt) => {
        window.addEventListener(evt, async () => {
          await ensurePlaybackHints();
        }, { once:true, passive:true });
      });
    }

    async function init(){
      createManifest();
      await registerSW();
      initThemes();
      bindControls();
      renderGenres();
      setPlayIcon(true);
      updateNowPlayingUI();
      updateTime();
      requestAnimationFrame(drawBackground);
      setupGestures();
      initWarmup();
      await selectGenre(currentGenre, false);
    }

    init();
  </script>
</body>
</html>
