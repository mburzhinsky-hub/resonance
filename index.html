<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RESONANCE</title>

  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <style>
    :root{
      --bg:#050505;
      --panel:rgba(255,255,255,.05);
      --panel-strong:rgba(255,255,255,.08);
      --line:rgba(255,255,255,.10);
      --line-strong:rgba(255,255,255,.18);
      --text:#ffffff;
      --text-soft:rgba(255,255,255,.74);
      --text-muted:rgba(255,255,255,.52);
      --text-faint:rgba(255,255,255,.28);
      --safe-top:max(18px, env(safe-area-inset-top));
      --safe-bottom:max(18px, env(safe-area-inset-bottom));
      --shadow:0 18px 48px rgba(0,0,0,.38);
      --focus:0 0 0 3px rgba(190, 228, 255, .22);
      color-scheme:dark;
    }

    *{ box-sizing:border-box; }

    html, body{
      margin:0;
      width:100%;
      height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      text-rendering:optimizeLegibility;
    }

    body{
      overflow:hidden;
      position:relative;
      background:#050505;
    }

    button, input{
      font:inherit;
    }

    button{
      appearance:none;
      -webkit-appearance:none;
      border:none;
      background:none;
      color:inherit;
      padding:0;
      cursor:pointer;
    }

    button:focus-visible,
    input:focus-visible{
      outline:none;
      box-shadow:var(--focus);
    }

    #ambient{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      pointer-events:none;
      z-index:0;
    }

    .app{
      position:relative;
      z-index:1;
      width:100%;
      height:100%;
      display:flex;
      justify-content:center;
      align-items:stretch;
    }

    .shell{
      width:100%;
      max-width:440px;
      min-height:100%;
      padding:calc(var(--safe-top) + 2px) 20px calc(var(--safe-bottom) + 20px);
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .topbar{
      min-height:44px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
    }

    .brand{
      font-size:17px;
      font-weight:400;
      letter-spacing:.28em;
      color:rgba(255,255,255,.74);
      text-transform:uppercase;
      white-space:nowrap;
      user-select:none;
    }

    .genres-wrap{
      flex:0 0 auto;
      overflow:hidden;
    }

    .genres{
      display:flex;
      align-items:center;
      gap:10px;
      overflow-x:auto;
      padding:2px 0 4px;
      scrollbar-width:none;
      -ms-overflow-style:none;
      scroll-snap-type:x proximity;
    }

    .genres::-webkit-scrollbar{ display:none; }

    .genre-btn{
      flex:0 0 auto;
      min-height:44px;
      padding:0 18px;
      border-radius:999px;
      color:var(--text-soft);
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      transition:transform .15s ease, background .2s ease, border-color .2s ease, color .2s ease;
      scroll-snap-align:start;
      user-select:none;
    }

    .genre-btn:hover{ background:rgba(255,255,255,.06); }
    .genre-btn:active{ transform:scale(.985); }

    .genre-btn.active{
      color:#fff;
      background:rgba(255,255,255,.09);
      border-color:rgba(255,255,255,.18);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
    }

    .main{
      flex:1 1 auto;
      min-height:0;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      gap:24px;
    }

    .hero{
      flex:1 1 auto;
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:12px 4px 0;
    }

    .hero-inner{
      width:100%;
      max-width:340px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
    }

    .meta-row{
      min-height:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      color:var(--text-muted);
      font-size:14px;
      font-weight:500;
      letter-spacing:-.01em;
      flex-wrap:wrap;
    }

    .meta-dot{
      width:4px;
      height:4px;
      border-radius:50%;
      background:rgba(255,255,255,.18);
      flex:0 0 4px;
    }

    .track-title{
      width:100%;
      margin:0;
      font-size:clamp(36px, 11vw, 58px);
      line-height:.94;
      font-weight:650;
      letter-spacing:-.06em;
      text-wrap:balance;
      word-break:break-word;
    }

    .progress-block{
      width:100%;
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:4px;
    }

    .progress{
      appearance:none;
      -webkit-appearance:none;
      width:100%;
      height:28px;
      margin:0;
      background:transparent;
      cursor:pointer;
    }

    .progress::-webkit-slider-runnable-track{
      height:4px;
      border-radius:999px;
      background:linear-gradient(90deg, rgba(255,255,255,.80) 0 var(--progress, 0%), rgba(255,255,255,.14) var(--progress, 0%) 100%);
    }

    .progress::-webkit-slider-thumb{
      -webkit-appearance:none;
      width:16px;
      height:16px;
      border-radius:50%;
      background:#fff;
      border:none;
      margin-top:-6px;
      box-shadow:0 0 0 4px rgba(255,255,255,.10);
    }

    .progress::-moz-range-track{
      height:4px;
      border:none;
      border-radius:999px;
      background:rgba(255,255,255,.14);
    }

    .progress::-moz-range-progress{
      height:4px;
      border-radius:999px;
      background:rgba(255,255,255,.84);
    }

    .progress::-moz-range-thumb{
      width:16px;
      height:16px;
      border-radius:50%;
      border:none;
      background:#fff;
      box-shadow:0 0 0 4px rgba(255,255,255,.10);
    }

    .progress:disabled{
      cursor:default;
      opacity:.55;
    }

    .time-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      color:var(--text-muted);
      font-size:14px;
      font-variant-numeric:tabular-nums;
    }

    .status-pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      min-height:34px;
      padding:0 14px;
      border-radius:999px;
      color:var(--text-soft);
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }

    .status-pulse{
      width:7px;
      height:7px;
      border-radius:50%;
      background:rgba(255,255,255,.26);
      transition:background .2s ease, box-shadow .2s ease, transform .2s ease;
    }

    .status-pill.playing .status-pulse{
      background:rgba(255,255,255,.92);
      box-shadow:0 0 12px rgba(185, 229, 255, .28);
      transform:scale(1.08);
    }

    .controls-zone{
      flex:0 0 auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:16px;
    }

    .controls{
      width:100%;
      max-width:320px;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:14px;
    }

    .nav-btn,
    .list-btn{
      min-height:50px;
      border-radius:999px;
      color:var(--text-soft);
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      transition:transform .15s ease, background .2s ease, color .2s ease, border-color .2s ease;
      user-select:none;
    }

    .nav-btn{
      width:54px;
      height:54px;
      display:grid;
      place-items:center;
      justify-self:center;
    }

    .nav-btn:hover,
    .list-btn:hover{
      background:rgba(255,255,255,.07);
      color:#fff;
      border-color:rgba(255,255,255,.14);
    }

    .nav-btn:active,
    .list-btn:active,
    .play-btn:active{
      transform:scale(.98);
    }

    .nav-btn:disabled,
    .play-btn:disabled,
    .list-btn:disabled{
      opacity:.4;
      cursor:not-allowed;
      transform:none;
    }

    .play-btn{
      width:104px;
      height:104px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.12);
      color:#fff;
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 50% 30%, rgba(255,255,255,.10), rgba(255,255,255,.03) 58%, rgba(255,255,255,.02)),
        rgba(255,255,255,.03);
      box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.08);
      transition:transform .16s ease, box-shadow .22s ease, border-color .22s ease;
      user-select:none;
    }

    .play-btn.playing{
      border-color:rgba(255,255,255,.18);
      box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.10), 0 0 24px rgba(170, 225, 255, .08);
    }

    .list-btn{
      min-width:148px;
      padding:0 18px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }

    .sheet-backdrop{
      position:fixed;
      inset:0;
      z-index:20;
      background:rgba(0,0,0,.44);
      opacity:0;
      pointer-events:none;
      transition:opacity .22s ease;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }

    .sheet-backdrop.open{
      opacity:1;
      pointer-events:auto;
    }

    .sheet{
      position:fixed;
      inset:auto 0 0;
      z-index:21;
      padding:0 10px calc(var(--safe-bottom) + 10px);
      transform:translateY(104%);
      transition:transform .28s cubic-bezier(.2,.8,.2,1);
      pointer-events:none;
      touch-action:none;
    }

    .sheet.open{
      transform:translateY(0);
      pointer-events:auto;
    }

    .sheet-card{
      width:100%;
      max-width:440px;
      margin:0 auto;
      background:linear-gradient(to bottom, rgba(21,21,21,.98), rgba(8,8,8,.99));
      border:1px solid rgba(255,255,255,.08);
      border-radius:28px 28px 22px 22px;
      overflow:hidden;
      box-shadow:0 26px 80px rgba(0,0,0,.55);
    }

    .sheet-head{
      padding:12px 18px 10px;
      border-bottom:1px solid rgba(255,255,255,.06);
      user-select:none;
      touch-action:none;
    }

    .sheet-handle{
      width:42px;
      height:5px;
      margin:0 auto 12px;
      border-radius:999px;
      background:rgba(255,255,255,.16);
    }

    .sheet-title-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .sheet-title-row strong{
      font-size:15px;
      font-weight:650;
      letter-spacing:-.01em;
    }

    .sheet-title-row span{
      color:var(--text-muted);
      font-size:13px;
    }

    .track-list{
      max-height:min(56vh, 460px);
      overflow:auto;
      padding:8px 10px 10px;
      scrollbar-width:none;
      -ms-overflow-style:none;
      overscroll-behavior:contain;
    }

    .track-list::-webkit-scrollbar{ display:none; }

    .track-item{
      width:100%;
      min-height:58px;
      padding:12px 12px;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      text-align:left;
      background:transparent;
      border:1px solid transparent;
      transition:transform .15s ease, background .18s ease, border-color .18s ease;
    }

    .track-item:hover{
      background:rgba(255,255,255,.04);
    }

    .track-item:active{
      transform:scale(.995);
    }

    .track-item.active{
      background:rgba(255,255,255,.06);
      border-color:rgba(255,255,255,.08);
    }

    .track-main{
      min-width:0;
      display:flex;
      align-items:center;
      gap:12px;
      flex:1;
    }

    .track-number{
      width:28px;
      flex:0 0 28px;
      color:var(--text-faint);
      font-size:13px;
      font-weight:650;
      text-align:center;
      font-variant-numeric:tabular-nums;
    }

    .track-copy{
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:4px;
    }

    .track-name{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:15px;
      font-weight:550;
      letter-spacing:-.01em;
    }

    .track-sub{
      color:var(--text-muted);
      font-size:12px;
    }

    .track-indicator{
      width:8px;
      height:8px;
      border-radius:50%;
      background:rgba(255,255,255,.18);
      flex:0 0 8px;
      transition:background .2s ease, box-shadow .2s ease;
    }

    .track-item.active .track-indicator{
      background:rgba(255,255,255,.92);
      box-shadow:0 0 10px rgba(180, 225, 255, .28);
    }

    .empty-state{
      padding:22px 14px 26px;
      color:var(--text-muted);
      font-size:14px;
      line-height:1.5;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:calc(var(--safe-bottom) + 122px);
      transform:translateX(-50%) translateY(10px);
      z-index:30;
      padding:11px 15px;
      border-radius:999px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
      font-size:13px;
      font-weight:550;
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      box-shadow:0 14px 38px rgba(0,0,0,.28);
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease, transform .2s ease;
      white-space:nowrap;
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    .sr-only{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }

    @media (min-width: 480px){
      .shell{
        padding-left:24px;
        padding-right:24px;
      }
    }
  </style>
</head>
<body>
  <canvas id="ambient" aria-hidden="true"></canvas>

  <div class="app">
    <div class="shell">
      <header class="topbar">
        <div class="brand">RESONANCE</div>
      </header>

      <div class="genres-wrap">
        <div class="genres" id="genres" aria-label="Жанры"></div>
      </div>

      <main class="main">
        <section class="hero" aria-label="Сейчас играет">
          <div class="hero-inner">
            <div class="meta-row">
              <span id="genreLabel">Lo‑Fi</span>
              <span class="meta-dot" aria-hidden="true"></span>
              <span id="trackPosition">1 / 1</span>
            </div>

            <h1 class="track-title" id="trackTitle">Загрузка библиотеки…</h1>

            <div class="status-pill" id="statusPill">
              <span class="status-pulse" aria-hidden="true"></span>
              <span id="trackStatus">Подготовка</span>
            </div>

            <div class="progress-block">
              <label class="sr-only" for="progress">Позиция трека</label>
              <input id="progress" class="progress" type="range" min="0" max="1000" step="1" value="0" disabled />
              <div class="time-row">
                <span id="currentTime">00:00</span>
                <span id="durationTime">00:00</span>
              </div>
            </div>
          </div>
        </section>

        <section class="controls-zone" aria-label="Управление плеером">
          <div class="controls">
            <button class="nav-btn" id="prevBtn" type="button" aria-label="Предыдущий трек">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M15.5 18L9.5 12L15.5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </button>

            <button class="play-btn" id="playBtn" type="button" aria-label="Воспроизвести или поставить на паузу" aria-pressed="false">
              <svg id="playIcon" width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 6.7v10.6c0 .7.8 1.14 1.4.78l7.9-5.3a.93.93 0 0 0 0-1.56l-7.9-5.3A.93.93 0 0 0 9 6.7Z" fill="currentColor"></path>
              </svg>
            </button>

            <button class="nav-btn" id="nextBtn" type="button" aria-label="Следующий трек">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M8.5 18L14.5 12L8.5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </button>
          </div>

          <button class="list-btn" id="queueBtn" type="button" aria-haspopup="dialog" aria-expanded="false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M7 7H18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
              <path d="M7 12H18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
              <path d="M7 17H14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
            </svg>
            <span>Список треков</span>
          </button>
        </section>
      </main>
    </div>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>

  <section class="sheet" id="sheet" aria-hidden="true" aria-labelledby="sheetTitle" role="dialog">
    <div class="sheet-card">
      <div class="sheet-head" id="sheetHandle">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-title-row">
          <strong id="sheetTitle">Треки</strong>
          <span id="sheetMeta">0 треков</span>
        </div>
      </div>
      <div class="track-list" id="trackList"></div>
    </div>
  </section>

  <div class="toast" id="toast" aria-live="polite"></div>
  <audio id="audio" preload="metadata" playsinline></audio>

  <script>
    const APP_NAME = 'RESONANCE';

    // Оставил формат именования как в твоем текущем проекте:
    // ./lofi-1.mp3, ./lofi-2.mp3, ./jazz-1.mp3 и т.д.
    const GENRES = [
      { id: 'lofi', name: 'Lo‑Fi', prefix: 'lofi', maxFiles: 100 },
      { id: 'rap',  name: 'Rap',   prefix: 'rap',  maxFiles: 100 },
      { id: 'jazz', name: 'Jazz',  prefix: 'jazz', maxFiles: 100 }
    ];

    const STORAGE_KEY = 'resonance-player-state-v1';

    const audio = document.getElementById('audio');
    const genresEl = document.getElementById('genres');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const queueBtn = document.getElementById('queueBtn');
    const progressEl = document.getElementById('progress');
    const genreLabelEl = document.getElementById('genreLabel');
    const trackPositionEl = document.getElementById('trackPosition');
    const trackTitleEl = document.getElementById('trackTitle');
    const trackStatusEl = document.getElementById('trackStatus');
    const statusPillEl = document.getElementById('statusPill');
    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');
    const trackListEl = document.getElementById('trackList');
    const sheetEl = document.getElementById('sheet');
    const sheetBackdropEl = document.getElementById('sheetBackdrop');
    const sheetTitleEl = document.getElementById('sheetTitle');
    const sheetMetaEl = document.getElementById('sheetMeta');
    const sheetHandleEl = document.getElementById('sheetHandle');
    const toastEl = document.getElementById('toast');
    const canvas = document.getElementById('ambient');
    const ctx = canvas.getContext('2d', { alpha: true });

    const state = {
      currentGenreIndex: 0,
      currentTrackIndex: 0,
      currentTracks: [],
      currentTitle: 'RESONANCE',
      currentStatus: 'Подготовка',
      toastTimer: null,
      sheetOpen: false,
      sheetDrag: null,
      discoveryCache: new Map(),
      selectionToken: 0,
      lastIndexByGenre: {},
      seekWasPlaying: false,
      ambientPhase: 0
    };

    const particles = Array.from({ length: 22 }, () => ({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 1.5 + 0.4,
      alpha: Math.random() * 0.08 + 0.02,
      speed: Math.random() * 0.18 + 0.04
    }));

    function clamp(value, min, max){
      return Math.min(max, Math.max(min, value));
    }

    function escapeHtml(value){
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function stripExtension(filename){
      return filename.replace(/\.[^/.]+$/, '');
    }

    function prettifyFilename(url, fallbackIndex = 0){
      try{
        const fileName = decodeURIComponent(url.split('/').pop() || '');
        const clean = stripExtension(fileName).replace(/[_-]+/g, ' ').trim();
        if (clean) return clean;
      }catch(error){}
      return `Трек ${fallbackIndex + 1}`;
    }

    function formatTime(seconds){
      if (!Number.isFinite(seconds) || seconds < 0) return '00:00';
      const minutes = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function getCurrentGenre(){
      return GENRES[state.currentGenreIndex] || GENRES[0];
    }

    function getCurrentTrack(){
      return state.currentTracks[state.currentTrackIndex] || null;
    }

    function setStatus(text){
      state.currentStatus = text;
      trackStatusEl.textContent = text;
      statusPillEl.classList.toggle('playing', !audio.paused && !!audio.src);
    }

    function setPlayButton(paused){
      playBtn.classList.toggle('playing', !paused);
      playBtn.setAttribute('aria-pressed', String(!paused));
      playIcon.innerHTML = paused
        ? '<path d="M9 6.7v10.6c0 .7.8 1.14 1.4.78l7.9-5.3a.93.93 0 0 0 0-1.56l-7.9-5.3A.93.93 0 0 0 9 6.7Z" fill="currentColor"></path>'
        : '<path d="M8 6.5v11M16 6.5v11" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>';
    }

    function showToast(message){
      clearTimeout(state.toastTimer);
      toastEl.textContent = message;
      toastEl.classList.add('show');
      state.toastTimer = setTimeout(() => {
        toastEl.classList.remove('show');
      }, 1600);
    }

    function resizeCanvas(){
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function getGenreColors(genreId){
      switch(genreId){
        case 'rap': return ['210,210,210', '128,128,128'];
        case 'jazz': return ['255,204,136', '255,136,178'];
        case 'lofi':
        default: return ['145,214,255', '160,178,255'];
      }
    }

    function drawAmbientFrame(timestamp){
      const width = window.innerWidth;
      const height = window.innerHeight;
      const isPlaying = !audio.paused && !!audio.src;
      const energy = isPlaying ? 0.17 : 0.07;
      state.ambientPhase += (energy - state.ambientPhase) * 0.03;

      const genre = getCurrentGenre();
      const [c1, c2] = getGenreColors(genre?.id);
      const t = timestamp * 0.001;

      ctx.clearRect(0, 0, width, height);

      const topGlow = ctx.createRadialGradient(width * .5, height * .24, 0, width * .5, height * .24, Math.min(width, height) * .42);
      topGlow.addColorStop(0, `rgba(${c1}, ${0.05 + state.ambientPhase * 0.11})`);
      topGlow.addColorStop(.45, `rgba(${c1}, ${0.02 + state.ambientPhase * 0.04})`);
      topGlow.addColorStop(1, `rgba(${c1}, 0)`);
      ctx.fillStyle = topGlow;
      ctx.fillRect(0, 0, width, height);

      const bottomGlow = ctx.createRadialGradient(width * .78, height * .76, 0, width * .78, height * .76, Math.min(width, height) * .42);
      bottomGlow.addColorStop(0, `rgba(${c2}, ${0.05 + state.ambientPhase * 0.12})`);
      bottomGlow.addColorStop(.45, `rgba(${c2}, ${0.02 + state.ambientPhase * 0.04})`);
      bottomGlow.addColorStop(1, `rgba(${c2}, 0)`);
      ctx.fillStyle = bottomGlow;
      ctx.fillRect(0, 0, width, height);

      const lineY = height * .52;
      const beam = ctx.createLinearGradient(width * .2, lineY, width * .8, lineY);
      beam.addColorStop(0, `rgba(${c1}, 0)`);
      beam.addColorStop(.5, `rgba(255,255,255, ${0.04 + state.ambientPhase * 0.14})`);
      beam.addColorStop(1, `rgba(${c2}, 0)`);
      ctx.fillStyle = beam;
      ctx.fillRect(width * .2, lineY, width * .6, 1);

      for (const particle of particles){
        const x = particle.x * width + Math.sin(t * particle.speed + particle.y * 8) * 10;
        const y = particle.y * height + Math.cos(t * particle.speed + particle.x * 7) * 10;
        ctx.beginPath();
        ctx.arc(x, y, particle.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255, ${particle.alpha * (1 + state.ambientPhase * 1.3)})`;
        ctx.fill();
      }

      requestAnimationFrame(drawAmbientFrame);
    }

    async function fileExists(url){
      if (location.protocol === 'file:') return true;

      try{
        const headResponse = await fetch(url, { method: 'HEAD', cache: 'no-store' });
        if (headResponse.ok) return true;
      }catch(error){}

      try{
        const rangeResponse = await fetch(url, {
          method: 'GET',
          headers: { Range: 'bytes=0-0' },
          cache: 'no-store'
        });
        return rangeResponse.ok || rangeResponse.status === 206;
      }catch(error){
        return false;
      }
    }

    async function discoverTracks(genre){
      const tracks = [];

      for (let index = 1; index <= genre.maxFiles; index += 1){
        const src = `./${genre.prefix}-${index}.mp3`;
        const exists = await fileExists(src);

        if (!exists){
          if (location.protocol !== 'file:') break;
          continue;
        }

        tracks.push({
          src,
          title: prettifyFilename(src, index - 1)
        });
      }

      return tracks;
    }

    async function ensureGenreTracks(genre){
      const cached = state.discoveryCache.get(genre.id);
      if (cached){
        return cached instanceof Promise ? cached : Promise.resolve(cached);
      }

      const discoveryPromise = discoverTracks(genre)
        .then((tracks) => {
          state.discoveryCache.set(genre.id, tracks);
          return tracks;
        })
        .catch((error) => {
          state.discoveryCache.delete(genre.id);
          throw error;
        });

      state.discoveryCache.set(genre.id, discoveryPromise);
      return discoveryPromise;
    }

    function updateButtonsState(){
      const hasTracks = state.currentTracks.length > 0;
      playBtn.disabled = !hasTracks;
      prevBtn.disabled = !hasTracks;
      nextBtn.disabled = !hasTracks;
      queueBtn.disabled = !hasTracks;
      progressEl.disabled = !hasTracks || !Number.isFinite(audio.duration) || audio.duration <= 0;
    }

    function updateProgressUI(){
      const hasDuration = Number.isFinite(audio.duration) && audio.duration > 0;
      const currentTime = hasDuration ? audio.currentTime : 0;
      const ratio = hasDuration ? clamp(currentTime / audio.duration, 0, 1) : 0;
      const value = Math.round(ratio * 1000);

      progressEl.value = String(value);
      progressEl.style.setProperty('--progress', `${ratio * 100}%`);
      currentTimeEl.textContent = formatTime(currentTime);
      durationTimeEl.textContent = formatTime(hasDuration ? audio.duration : 0);
      progressEl.disabled = !state.currentTracks.length || !hasDuration;
    }

    function updateNowPlayingUI(){
      const genre = getCurrentGenre();
      const track = getCurrentTrack();
      const hasTracks = state.currentTracks.length > 0;

      genreLabelEl.textContent = genre?.name || APP_NAME;
      trackTitleEl.textContent = track?.title || `${genre?.name || APP_NAME}`;
      trackPositionEl.textContent = hasTracks ? `${state.currentTrackIndex + 1} / ${state.currentTracks.length}` : '0 / 0';
      sheetTitleEl.textContent = genre?.name || 'Треки';
      sheetMetaEl.textContent = hasTracks ? `${state.currentTracks.length} треков` : 'Нет треков';

      updateButtonsState();
      updateProgressUI();
      renderTrackList();
    }

    function scrollActiveTrackIntoView(){
      const activeItem = trackListEl.querySelector('.track-item.active');
      if (!activeItem) return;
      activeItem.scrollIntoView({ block: 'nearest' });
    }

    function renderGenres(){
      genresEl.innerHTML = '';

      GENRES.forEach((genre, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'genre-btn';
        button.textContent = genre.name;
        button.setAttribute('aria-pressed', String(index === state.currentGenreIndex));

        if (index === state.currentGenreIndex) {
          button.classList.add('active');
        }

        button.addEventListener('click', async () => {
          await selectGenre(index, { autoplay: true, preferRememberedTrack: true });
        });

        genresEl.appendChild(button);
      });
    }

    function renderTrackList(){
      trackListEl.innerHTML = '';

      if (!state.currentTracks.length){
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'В этом жанре не найдено ни одного MP3-файла. Проверь, что файлы лежат рядом с HTML и называются вроде jazz-1.mp3, jazz-2.mp3.';
        trackListEl.appendChild(empty);
        return;
      }

      state.currentTracks.forEach((track, index) => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'track-item';
        item.dataset.index = String(index);
        item.setAttribute('aria-label', `Выбрать трек ${track.title}`);

        if (index === state.currentTrackIndex){
          item.classList.add('active');
        }

        item.innerHTML = `
          <span class="track-main">
            <span class="track-number">${String(index + 1).padStart(2, '0')}</span>
            <span class="track-copy">
              <span class="track-name">${escapeHtml(track.title)}</span>
              <span class="track-sub">${escapeHtml(getCurrentGenre().name)}</span>
            </span>
          </span>
          <span class="track-indicator" aria-hidden="true"></span>
        `;

        item.addEventListener('click', async () => {
          await selectTrack(index, { autoplay: true, closeAfter: true });
        });

        trackListEl.appendChild(item);
      });
    }

    function persistState(){
      try{
        const payload = {
          genreId: getCurrentGenre()?.id || GENRES[0].id,
          lastIndexByGenre: state.lastIndexByGenre
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      }catch(error){}
    }

    function restoreState(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;

        const saved = JSON.parse(raw);
        const restoredGenreIndex = GENRES.findIndex((genre) => genre.id === saved.genreId);

        if (restoredGenreIndex >= 0){
          state.currentGenreIndex = restoredGenreIndex;
        }

        if (saved && typeof saved.lastIndexByGenre === 'object' && saved.lastIndexByGenre){
          state.lastIndexByGenre = saved.lastIndexByGenre;
        }
      }catch(error){}
    }

    function updateMediaSession(){
      if (!('mediaSession' in navigator)) return;

      const genre = getCurrentGenre();
      const track = getCurrentTrack();
      const artwork = createArtworkDataUrl(genre?.name || APP_NAME);

      navigator.mediaSession.metadata = new MediaMetadata({
        title: track?.title || APP_NAME,
        artist: genre?.name || APP_NAME,
        album: APP_NAME,
        artwork: [{ src: artwork, sizes: '512x512', type: 'image/svg+xml' }]
      });

      try{ navigator.mediaSession.setActionHandler('play', async () => { await safePlay(); }); }catch(error){}
      try{ navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); }); }catch(error){}
      try{ navigator.mediaSession.setActionHandler('nexttrack', async () => { await playNext(); }); }catch(error){}
      try{ navigator.mediaSession.setActionHandler('previoustrack', async () => { await playPrev(); }); }catch(error){}

      navigator.mediaSession.playbackState = audio.paused ? 'paused' : 'playing';
    }

    function createArtworkDataUrl(label){
      const safeLabel = String(label || APP_NAME).slice(0, 18);
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <rect width="512" height="512" rx="110" fill="#050505"/>
          <text x="256" y="280" fill="white" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="56" letter-spacing="10">${safeLabel}</text>
        </svg>
      `);
    }

    async function safePlay(){
      try{
        if ('audioSession' in navigator && navigator.audioSession){
          navigator.audioSession.type = 'playback';
        }
      }catch(error){}

      try{
        await audio.play();
        return true;
      }catch(error){
        setStatus('Нажми ещё раз для старта');
        showToast('Браузер пока не дал запустить звук');
        return false;
      }
    }

    async function loadTrack(index, { autoplay = true } = {}){
      if (!state.currentTracks.length) return;

      state.currentTrackIndex = clamp(index, 0, state.currentTracks.length - 1);
      const genre = getCurrentGenre();
      const track = getCurrentTrack();

      if (!track) return;

      state.lastIndexByGenre[genre.id] = state.currentTrackIndex;
      persistState();

      trackTitleEl.textContent = track.title;
      trackPositionEl.textContent = `${state.currentTrackIndex + 1} / ${state.currentTracks.length}`;
      currentTimeEl.textContent = '00:00';
      durationTimeEl.textContent = '00:00';
      progressEl.value = '0';
      progressEl.style.setProperty('--progress', '0%');
      setStatus('Загрузка…');

      audio.src = track.src;
      audio.load();

      updateNowPlayingUI();
      updateMediaSession();

      if (autoplay){
        await safePlay();
      } else {
        setPlayButton(true);
      }
    }

    async function selectTrack(index, { autoplay = true, closeAfter = false } = {}){
      await loadTrack(index, { autoplay });
      if (closeAfter) closeSheet();
    }

    async function selectGenre(index, { autoplay = true, preferRememberedTrack = true } = {}){
      const genre = GENRES[index];
      if (!genre) return;

      const token = ++state.selectionToken;
      closeSheet();
      audio.pause();
      state.currentGenreIndex = index;
      state.currentTracks = [];
      state.currentTrackIndex = 0;
      trackTitleEl.textContent = `${genre.name}`;
      setStatus('Загрузка библиотеки…');

      renderGenres();
      updateNowPlayingUI();

      try{
        const tracks = await ensureGenreTracks(genre);
        if (token !== state.selectionToken) return;

        state.currentTracks = tracks;

        if (!tracks.length){
          audio.pause();
          audio.removeAttribute('src');
          audio.load();
          setPlayButton(true);
          setStatus('Нет треков');
          updateNowPlayingUI();
          showToast(`В жанре ${genre.name} нет файлов`);
          return;
        }

        const rememberedIndex = preferRememberedTrack ? state.lastIndexByGenre[genre.id] : 0;
        const targetIndex = Number.isInteger(rememberedIndex)
          ? clamp(rememberedIndex, 0, tracks.length - 1)
          : 0;

        await loadTrack(targetIndex, { autoplay });
      }catch(error){
        if (token !== state.selectionToken) return;
        audio.pause();
        audio.removeAttribute('src');
        audio.load();
        state.currentTracks = [];
        state.currentTrackIndex = 0;
        setPlayButton(true);
        setStatus('Ошибка библиотеки');
        updateNowPlayingUI();
        showToast('Не удалось прочитать файлы этого жанра');
      }
    }

    async function togglePlayback(){
      if (!state.currentTracks.length){
        await selectGenre(state.currentGenreIndex, { autoplay: true, preferRememberedTrack: true });
        return;
      }

      if (audio.paused){
        await safePlay();
      } else {
        audio.pause();
      }
    }

    async function playNext(){
      if (!state.currentTracks.length) return;
      const nextIndex = (state.currentTrackIndex + 1) % state.currentTracks.length;
      await loadTrack(nextIndex, { autoplay: true });
    }

    async function playPrev(){
      if (!state.currentTracks.length) return;
      const prevIndex = (state.currentTrackIndex - 1 + state.currentTracks.length) % state.currentTracks.length;
      await loadTrack(prevIndex, { autoplay: true });
    }

    function openSheet(){
      if (!state.currentTracks.length) return;
      state.sheetOpen = true;
      sheetEl.classList.add('open');
      sheetBackdropEl.classList.add('open');
      sheetEl.setAttribute('aria-hidden', 'false');
      queueBtn.setAttribute('aria-expanded', 'true');
      renderTrackList();
      requestAnimationFrame(scrollActiveTrackIntoView);
    }

    function closeSheet(){
      state.sheetOpen = false;
      sheetEl.classList.remove('open');
      sheetBackdropEl.classList.remove('open');
      sheetEl.style.removeProperty('transform');
      sheetEl.setAttribute('aria-hidden', 'true');
      queueBtn.setAttribute('aria-expanded', 'false');
    }

    function setupSheetInteractions(){
      queueBtn.addEventListener('click', () => {
        if (state.sheetOpen) closeSheet();
        else openSheet();
      });

      sheetBackdropEl.addEventListener('click', closeSheet);

      const onPointerMove = (event) => {
        if (!state.sheetDrag) return;
        const delta = Math.max(0, event.clientY - state.sheetDrag.startY);
        sheetEl.style.transition = 'none';
        sheetEl.style.transform = `translateY(${delta}px)`;
        state.sheetDrag.delta = delta;
      };

      const onPointerUp = () => {
        if (!state.sheetDrag) return;

        const delta = state.sheetDrag.delta;
        state.sheetDrag = null;
        sheetEl.style.removeProperty('transition');

        if (delta > 120){
          closeSheet();
        } else {
          sheetEl.style.transform = 'translateY(0)';
          requestAnimationFrame(() => {
            if (state.sheetOpen) sheetEl.style.removeProperty('transform');
          });
        }

        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('pointerup', onPointerUp);
        window.removeEventListener('pointercancel', onPointerUp);
      };

      sheetHandleEl.addEventListener('pointerdown', (event) => {
        if (!state.sheetOpen) return;
        state.sheetDrag = { startY: event.clientY, delta: 0 };
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        window.addEventListener('pointercancel', onPointerUp);
      });
    }

    function setupProgressInteractions(){
      progressEl.addEventListener('input', () => {
        const hasDuration = Number.isFinite(audio.duration) && audio.duration > 0;
        if (!hasDuration) return;

        const ratio = Number(progressEl.value) / 1000;
        const nextTime = audio.duration * ratio;
        currentTimeEl.textContent = formatTime(nextTime);
        progressEl.style.setProperty('--progress', `${ratio * 100}%`);
      });

      progressEl.addEventListener('pointerdown', () => {
        if (audio.paused) {
          state.seekWasPlaying = false;
          return;
        }
        state.seekWasPlaying = true;
        audio.pause();
      });

      progressEl.addEventListener('change', async () => {
        const hasDuration = Number.isFinite(audio.duration) && audio.duration > 0;
        if (!hasDuration) return;

        const ratio = Number(progressEl.value) / 1000;
        audio.currentTime = audio.duration * ratio;
        updateProgressUI();

        if (state.seekWasPlaying){
          state.seekWasPlaying = false;
          await safePlay();
        }
      });
    }

    function setupKeyboard(){
      window.addEventListener('keydown', async (event) => {
        if (event.key === ' '){
          event.preventDefault();
          await togglePlayback();
        }
        if (event.key === 'ArrowRight') await playNext();
        if (event.key === 'ArrowLeft') await playPrev();
        if (event.key === 'Escape') closeSheet();
      });
    }

    function attachAudioEvents(){
      audio.addEventListener('loadstart', () => {
        setStatus('Загрузка…');
        updateProgressUI();
      });

      audio.addEventListener('loadedmetadata', () => {
        updateProgressUI();
        setStatus(audio.paused ? 'Готово' : 'Играет');
      });

      audio.addEventListener('canplay', () => {
        setStatus(audio.paused ? 'Готово' : 'Играет');
      });

      audio.addEventListener('waiting', () => {
        setStatus('Буферизация…');
      });

      audio.addEventListener('playing', () => {
        setPlayButton(false);
        setStatus('Играет');
        updateMediaSession();
        renderTrackList();
      });

      audio.addEventListener('pause', () => {
        setPlayButton(true);
        if (audio.src) setStatus('Пауза');
        updateMediaSession();
        renderTrackList();
      });

      audio.addEventListener('timeupdate', updateProgressUI);

      audio.addEventListener('ended', async () => {
        await playNext();
      });

      audio.addEventListener('error', async () => {
        showToast('Не удалось загрузить трек');
        setStatus('Ошибка трека');

        if (state.currentTracks.length > 1){
          await playNext();
        } else {
          audio.pause();
        }
      });
    }

    function attachControlEvents(){
      playBtn.addEventListener('click', togglePlayback);
      prevBtn.addEventListener('click', playPrev);
      nextBtn.addEventListener('click', playNext);
    }

    async function init(){
      restoreState();
      resizeCanvas();
      renderGenres();
      setPlayButton(true);
      setStatus('Подготовка');
      updateNowPlayingUI();
      setupSheetInteractions();
      setupProgressInteractions();
      setupKeyboard();
      attachControlEvents();
      attachAudioEvents();
      requestAnimationFrame(drawAmbientFrame);
      window.addEventListener('resize', resizeCanvas);

      await selectGenre(state.currentGenreIndex, { autoplay: false, preferRememberedTrack: true });
    }

    init();
  </script>
</body>
</html>
